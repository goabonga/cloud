version: 2

# The trusted rewrite workflow replaces bot authorship and signs commits.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1000000
    groups:
      go-dependencies:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1000000
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  # Python tooling under scripts/ is not shipped, so its updates stay chores.
  - package-ecosystem: uv
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1000000
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - python
