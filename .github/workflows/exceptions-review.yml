name: exceptions-review

# Every week, each exception expiring within seven days gets an issue and a pull
# request removing it, so the finding is fixed or the exception renewed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: review expiring exceptions
    runs-on: ubuntu-24.04
    concurrency:
      group: exceptions-review
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure the maintainer signing identity
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PUSH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
          GIT_SIGNING_KEY: ${{ vars.GIT_SIGNING_KEY }}
        run: python3 scripts/ci_automation.py configure-signing
      - name: Open issues and review pull requests for expiring exceptions
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
        run: python3 scripts/ci_automation.py exceptions-review
      - name: Remove signing credentials
        if: always()
        run: python3 scripts/ci_automation.py cleanup
      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci_automation.py summary --title "Exception review"
