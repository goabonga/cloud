          body: amd64 package uploaded as `infra-www-deb`.

  deb-validate-infra:
    name: deb-validate (infra)
    needs: deb-infra
    permissions:
      contents: read
      actions: write # delete the artifact of a package that fails validation
    # always(): deb-<component>'s own transitive chain (lint, vet-build, ...)
    # can legitimately be `skipped` on the packaging_changed path - without
    # this, GitHub's implicit success() over that whole chain would skip this
    # job too, even though deb-<component> itself just succeeded.
    if: always() && needs.deb-infra.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # No probe: a missing artifact means the build leg failed, which
      # already skips this job via the needs.deb-X.result check above.
      - uses: ./.github/actions/validate-deb
        with:
          component: infra
          has-unit: "false"
          security-threshold: "11"
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: deb-validate (infra)
          body: |
            lintian (`--fail-on error`), `test/install/validate.sh` against the
            installed package, and `systemd-analyze security` at threshold
            `11`.

  deb-validate-infra-api:
    name: deb-validate (infra-api)
    needs: deb-infra-api
    permissions:
      contents: read
      actions: write # delete the artifact of a package that fails validation
    # See deb-validate-infra's identical condition for the reasoning.
    if: always() && needs.deb-infra-api.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/validate-deb
