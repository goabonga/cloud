  # ---------------------------------------------------------------------
  # Arch Linux packaging chain. Same nine components and the same
  # has_package_changes/packaging_changed gate as deb/deb-validate, but
  # makepkg only exists inside an Arch userland, so these jobs run in a
  # `container: archlinux:base-devel` rather than on the bare ubuntu-24.04
  # runner deb uses for dpkg-deb. Named per component for the same visibility
  # reason as deb above.
  # ---------------------------------------------------------------------

  archlinux-infra:
    name: archlinux (infra)
    needs: [detect, lint, vet-build, test, gosec, govulncheck, osv-scanner]
    # See deb-infra's identical condition for the reasoning.
    if: >-
      always() && (
        (
          needs.detect.outputs.has_package_changes == 'true'
          && needs.lint.result == 'success'
          && needs.vet-build.result == 'success'
          && needs.test.result == 'success'
          && needs.gosec.result == 'success'
          && needs.govulncheck.result == 'success'
          && needs.osv-scanner.result == 'success'
        )
        || (
          needs.detect.outputs.has_package_changes != 'true'
          && needs.detect.outputs.packaging_changed == 'true'
        )
      )
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      # archlinux:base-devel ships no git (it is not actually part of the
      # base-devel group, despite the name). Must run BEFORE checkout, not
      # just before bump-preview: without git on PATH yet, checkout falls
      # back to downloading a plain tarball over the GitHub REST API - no
      # .git directory at all - and installing git afterwards would not
      # retroactively give multicz a repository to read.
      - name: Install git
        shell: bash
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # checkout's own "detected dubious ownership" workaround is scoped to
      # a temporary HOME it restores afterwards, so the safe.directory
      # exception it adds never reaches the real $HOME subsequent steps run
      # with. multicz's own `git` calls hit that bare.
      - name: Trust the checkout for subsequent git commands
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/build-archlinux
        with:
          component: infra
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: archlinux (infra)
          body: x86_64 package uploaded as `infra-archlinux`.

