name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancels superseded PR runs but never main-branch releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Config sanity ahead of everything else. `multicz validate --strict` catches
  # a component whose `paths` match nothing, a `bump_files` entry pointing at a
  # missing file or an unparseable version constant, a broken cascade edge, a
  # tag_format collision. Its own job rather than a step inside `detect`: those
  # are the failures that make `multicz changed` return a plausible-looking but
  # wrong answer, and a distinct red job names the cause instead of burying it
  # in the change-detection log.
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/multicz-validate
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: validate
          body: "`multicz validate --strict` on `multicz.toml`."

  # Detect which components changed since the comparison ref. On PR: vs the
  # target branch. On main: vs each component's last tag (multicz default),
  # which scopes the release matrix to bump-worthy work. multicz is
  # language-agnostic: it reads multicz.toml `paths`, so it works on the Go
  # module just as it does on a Python workspace.
  #
  # Docs and integration detection bypass multicz on purpose: neither carries
  # a version of its own, so there is no tag for `multicz changed` to compare
  # against. We use a plain `git diff` on their paths instead.
  detect:
    name: detect changed components
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only this job's own duplicate-push check reads run history; nothing
      # else here needs more than the default contents:read.
      actions: read
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_package_changes: ${{ steps.detect.outputs.has_package_changes }}
      docs_changed: ${{ steps.detect.outputs.docs_changed }}
      integration_changed: ${{ steps.detect.outputs.integration_changed }}
      www_changed: ${{ steps.detect.outputs.www_changed }}
      packaging_changed: ${{ steps.detect.outputs.packaging_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/detect-changes

  # Quality jobs run once over the whole Go module rather than per component:
  # the repo is a single `go` module, so `golangci-lint run`, `go vet` and
  # `go test ./...` already operate package-by-package and per-component
  # sharding would only add a brittle component->path lookup with no gain.
  # They gate on `has_package_changes` so docs-only / chore-only pushes skip.

  license-headers:
    name: license-headers
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/license-headers
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: license-headers
          body: SPDX headers on `cmd/`, `internal/`, `test/`, `scripts/`, `.github/`.

  lint:
    name: lint
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/golangci-lint
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: lint
          body: "`golangci-lint run` over the Go module."

  # Frontend quality gate (Node toolchain): lint, type-check, unit tests and a
  # production build of the Vite SPA. Gated on changes under www/.
  www:
    name: www
    needs: detect
    # Gated on www_changed alone: `go build ./...` in vet-build embeds only
    # cmd/www/dist/.gitkeep, never the real bundle, and `deb` rebuilds the SPA
    # from the current www/ tree on every run regardless of this job - so this
    # eslint/tsc/vitest gate has nothing to re-validate when www/ itself
    # hasn't changed. `release` and `docs`, which need this job, already
    # tolerate a skip.
    if: needs.detect.outputs.www_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 + bump-preview: the production build below is stamped
      # with www/package.json's version, so without the preview a pull request
      # would validate a bundle carrying the previous release's number.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/www-quality
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: www
          body: "`eslint`, `tsc`, `vitest` with coverage (uploaded to Codecov) and a production `vite build` of the SPA."

  vet-build:
    name: vet + build
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Compile against the version the next release will ship, not the last
      # one: `cmd/<component>/version.go` is a bump_files target.
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/go-vet-build
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: vet + build
          body: "`go vet` (both build tags) and `go build ./...`."

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/go-test
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: test
          body: "`go test -race` with coverage, uploaded to Codecov."

  gosec:
    name: gosec
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gosec
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: gosec
          body: "`gosec` static security analysis over the Go module."

  govulncheck:
    name: govulncheck
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/govulncheck
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: govulncheck
          body: "`govulncheck` against the Go vulnerability database, less the entries `osv-scanner.toml` accepts."

  osv-scanner:
    name: osv-scanner
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/osv-scanner
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: osv-scanner
          body: "`osv-scanner` on the `go.mod` dependency closure."

  # Privileged kernel-level integration suite (build tag `integration`). Runs
  # when any component changed OR the suite itself changed. NOTE: the real
  # netns / iptables / cgroups tests added from M3 need a privileged host
  # (root + CAP_NET_ADMIN); wire a self-hosted or privileged runner here then.
  # The M0 smoke test only proves the tag wires up, so a hosted runner suffices.
  integration:
    name: integration
    needs: detect
    if: >-
      needs.detect.outputs.has_package_changes == 'true'
      || needs.detect.outputs.integration_changed == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/integration-test
        with:
          postgres-dsn: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: integration
          body: |
            `go test -tags=integration` against a postgres service, with
            `/dev/kvm` opened up for the hypervisor tests. The kernel-level
            cases (bridge, firewall) self-skip without root.

  # ---------------------------------------------------------------------
  # Debian packaging chain. Every component except infra-spa ships as a .deb -
  # the SPA bundle is embedded into infra-www's binary rather than installed
  # on its own. The .deb the release publishes is the artifact this chain
  # cleared, not a rebuild of it.
  # ---------------------------------------------------------------------

  deb:
    name: deb (${{ matrix.component }})
    needs: [detect, lint, vet-build, test, gosec, govulncheck, osv-scanner]
    # Two independent reasons to build: a component changed (has_package_
    # changes), in which case every quality gate above gated on the same
    # flag must have actually succeeded - not merely "didn't fail", which
    # `!cancelled() && !failure()` alone would also accept for a gate GitHub
    # marked `skipped` without this job's knowledge of why. Or the packaging
    # scripts/actions themselves changed (packaging_changed) with no
    # component touched, in which case those six gates are expected to have
    # skipped (nothing Go to lint/test) and that is not a reason to refuse
    # building - see detect-changes' own description for the PR #115 case
    # this exists for.
    #
    # always(): without one of the four status-check functions literally
    # present, GitHub silently ANDs an implicit `success()` onto this whole
    # expression - which would require every direct need (lint, vet-build,
    # ...) to have actually run and succeeded, defeating the
    # packaging_changed branch below outright (those six are *expected* to
    # be skipped on that path). `always()` opts out of the implicit default
    # so the explicit `.result` checks below are the only gate in effect.
    # Confirmed by reproducing against a real run: without `always()`, every
    # leg of this matrix stayed `skipped` even with packaging_changed
    # correctly computed `true` end to end.
    if: >-
      always() && (
        (
          needs.detect.outputs.has_package_changes == 'true'
          && needs.lint.result == 'success'
          && needs.vet-build.result == 'success'
          && needs.test.result == 'success'
          && needs.gosec.result == 'success'
          && needs.govulncheck.result == 'success'
          && needs.osv-scanner.result == 'success'
        )
        || (
          needs.detect.outputs.has_package_changes != 'true'
          && needs.detect.outputs.packaging_changed == 'true'
        )
      )
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - infra
          - infra-api
          - infra-idp
          - infra-exporter
          - infra-controller-manager
          - infra-agent
          - infra-container-init
          - terraform-provider-infra
          - infra-www
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The .deb carries the version in its filename and its control file, so
      # it has to be the version the release will publish.
      - uses: ./.github/actions/bump-preview
      # All nine, every run: a component released by cascade needs a package
      # too, and `multicz changed` cannot tell us which those are.
      - uses: ./.github/actions/build-deb
        with:
          component: ${{ matrix.component }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: deb (${{ matrix.component }})
          body: amd64 package uploaded as `${{ matrix.component }}-deb`.

  deb-validate:
    name: deb-validate (${{ matrix.component }})
    needs: deb
    if: needs.deb.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write # delete the artifact of a package that fails validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: infra
            has_unit: "false"
          - component: infra-container-init
            has_unit: "false"
          - component: terraform-provider-infra
            has_unit: "false"
          - component: infra-api
            has_unit: "true"
          - component: infra-idp
            has_unit: "true"
          - component: infra-exporter
            has_unit: "true"
          - component: infra-controller-manager
            has_unit: "true"
          # infra-agent reconciles kernel state, so its unit cannot take the
          # hardening the control-plane daemons do - see
          # deploy/systemd/infra-agent.service for which directives would
          # break which reconciler. 75 holds the line at its current 7.2
          # without pretending it can reach 1.1.
          - component: infra-agent
            has_unit: "true"
            security_threshold: "75"
          - component: infra-www
            has_unit: "true"
    steps:
      - uses: actions/checkout@v7
      # No probe: `deb` builds all nine legs on every run, so a missing
      # artifact means its leg failed - and that already skips this job
      # through `!failure()`.
      - uses: ./.github/actions/validate-deb
        with:
          component: ${{ matrix.component }}
          has-unit: ${{ matrix.has_unit }}
          security-threshold: ${{ matrix.security_threshold || '11' }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: deb-validate (${{ matrix.component }})
          body: |
            lintian (`--fail-on error`), `test/install/validate.sh` against the
            installed package, and `systemd-analyze security` at threshold
            `${{ matrix.security_threshold || '11' }}`.

  # ---------------------------------------------------------------------
  # Arch Linux packaging chain. Same nine components and the same
  # has_package_changes gate as `deb`/`deb-validate`, but makepkg only exists
  # inside an Arch userland, so these two jobs run in a `container:
  # archlinux:base-devel` rather than on the bare ubuntu-24.04 runner `deb`
  # uses for dpkg-deb.
  # ---------------------------------------------------------------------

  archlinux:
    name: archlinux (${{ matrix.component }})
    needs: [detect, lint, vet-build, test, gosec, govulncheck, osv-scanner]
    # See `deb`'s identical condition for why this checks each gate's result
    # explicitly rather than the weaker `!cancelled() && !failure()`, why
    # packaging_changed is a second, independent reason to build, and why
    # `always()` has to lead the expression.
    if: >-
      always() && (
        (
          needs.detect.outputs.has_package_changes == 'true'
          && needs.lint.result == 'success'
          && needs.vet-build.result == 'success'
          && needs.test.result == 'success'
          && needs.gosec.result == 'success'
          && needs.govulncheck.result == 'success'
          && needs.osv-scanner.result == 'success'
        )
        || (
          needs.detect.outputs.has_package_changes != 'true'
          && needs.detect.outputs.packaging_changed == 'true'
        )
      )
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        component:
          - infra
          - infra-api
          - infra-idp
          - infra-exporter
          - infra-controller-manager
          - infra-agent
          - infra-container-init
          - terraform-provider-infra
          - infra-www
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The .pkg.tar.zst carries the version in its PKGBUILD-rendered
      # filename, so it has to be the version the release will publish.
      - uses: ./.github/actions/bump-preview
      # All nine, every run: a component released by cascade needs a package
      # too, and `multicz changed` cannot tell us which those are.
      - uses: ./.github/actions/build-archlinux
        with:
          component: ${{ matrix.component }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: archlinux (${{ matrix.component }})
          body: x86_64 package uploaded as `${{ matrix.component }}-archlinux`.

  archlinux-validate:
    name: archlinux-validate (${{ matrix.component }})
    needs: archlinux
    if: needs.archlinux.result == 'success'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    permissions:
      contents: read
      actions: write # delete the artifact of a package that fails validation
    strategy:
      fail-fast: false
      matrix:
        component:
          - infra
          - infra-api
          - infra-idp
          - infra-exporter
          - infra-controller-manager
          - infra-agent
          - infra-container-init
          - terraform-provider-infra
          - infra-www
    steps:
      - uses: actions/checkout@v7
      # No probe: `archlinux` builds all nine legs on every run, so a missing
      # artifact means its leg failed - and that already skips this job
      # through `!failure()`.
      - uses: ./.github/actions/validate-archlinux
        with:
          component: ${{ matrix.component }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: archlinux-validate (${{ matrix.component }})
          body: |
            namcap and `test/install/validate-archlinux.sh` against the
            installed package.

  # ---------------------------------------------------------------------
  # End-to-end and DAST. Both bring the control plane up from source as plain
  # processes against PostgreSQL - the same five binaries `deploy/ansible`
  # installs as .debs, not a cluster nothing in this repo's own install path
  # uses. Each job starts its own stack: a shared one would make a ZAP failure
  # and an e2e failure indistinguishable, and the runners are parallel anyway.
  # ---------------------------------------------------------------------

  e2e:
    name: e2e
    needs: detect
    if: >-
      needs.detect.result == 'success'
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack-up
        with:
          postgres-dsn: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
      - name: Run the end-to-end suite
        run: test/e2e/smoke.sh
      # stack-up dumps on its own failure; this covers a failure of the suite
      # itself, which runs after the stack is up.
      - name: Dump logs on failure
        if: failure()
        run: cat /tmp/stack-logs/*.log || true
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: e2e
          body: |
            infra-api, infra-controller-manager, infra-idp, infra-exporter and
            infra-www built from source and run against PostgreSQL, then
            `test/e2e/smoke.sh` over the API, identity provider, exporter and
            dashboard.

  owasp:
    name: owasp (${{ matrix.name }})
    needs: [detect, e2e]
    # has_package_changes is repeated from `e2e` on purpose: a docs-only push
    # must not stand up two stacks to scan a control plane nothing changed.
    # Checking `needs.e2e.result` explicitly, rather than the job-wide
    # `!cancelled() && !failure()`, means a real e2e failure or an e2e
    # GitHub otherwise marks anything other than `success` both block this -
    # no reliance on how a cancellation happens to be attributed upstream.
    if: >-
      needs.detect.result == 'success'
      && needs.detect.outputs.has_package_changes == 'true'
      && needs.e2e.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            port: 8080
          - name: www
            port: 8088
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack-up
        with:
          postgres-dsn: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
      - uses: ./.github/actions/owasp-scan
        with:
          target: http://127.0.0.1:${{ matrix.port }}
          name: ${{ matrix.name }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp (${{ matrix.name }})
          body: |
            ZAP baseline against `${{ matrix.name }}` on port
            `${{ matrix.port }}`, gated by `.zap/rules.tsv`. Full report in
            artifact `zap-${{ matrix.name }}`.

  # Release on main only. multicz bumps cmd/<dir>/version.go, writes
  # changelogs, creates the release commit and per-component tags, and pushes
  # back to main. Artifact distribution is handled by the `publish` job.
  release:
    name: release
    needs:
      - detect
      - license-headers
      - lint
      - www
      - vet-build
      - test
      - gosec
      - govulncheck
      - osv-scanner
      - integration
      - deb-validate
      - archlinux-validate
      - e2e
      - owasp
    # Every need below shares has_package_changes' own gate except `www`
    # (gated independently on www_changed, legitimately skipped on a
    # non-frontend push) - so every one of them is required to have actually
    # SUCCEEDED, `www` alone excepted. This used to read
    # `!cancelled() && !failure()`, which tolerates ANY need coming back
    # `skipped` for whatever reason, not just www's legitimate one - the
    # same shape of gap that let test-pipelilne-multicz's release-bump fire
    # once on a run cancelled before its validations had even dispatched,
    # tagging a release with nothing published behind it. Checking each
    # `result` directly closes that regardless of how GitHub happens to
    # attribute a cancellation to the jobs underneath it.
    #
    # always(): none of success()/failure()/cancelled()/always() appears
    # literally above, so without it GitHub silently ANDs an implicit
    # `success()` onto the whole expression - which would require `www` to
    # have succeeded even when www_changed is false and it legitimately
    # skipped, defeating that OR entirely.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.detect.result == 'success'
      && needs.detect.outputs.has_package_changes == 'true'
      && needs.license-headers.result == 'success'
      && needs.lint.result == 'success'
      && (needs.www.result == 'success' || needs.detect.outputs.www_changed != 'true')
      && needs.vet-build.result == 'success'
      && needs.test.result == 'success'
      && needs.gosec.result == 'success'
      && needs.govulncheck.result == 'success'
      && needs.osv-scanner.result == 'success'
      && needs.integration.result == 'success'
      && needs.deb-validate.result == 'success'
      && needs.archlinux-validate.result == 'success'
      && needs.e2e.result == 'success'
      && needs.owasp.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      no_bumps: ${{ steps.release.outputs.no_bumps }}
      bumped: ${{ steps.release.outputs.bumped }}
      bumped_json: ${{ steps.release.outputs.bumped_json }}
    steps:
      # `main-protection` (the repo ruleset) requires every change to main to
      # go through a pull request; the default GITHUB_TOKEN authenticates as
      # github-actions[bot], which has no bypass for it. RELEASE_PAT is the
      # maintainer's own PAT, the same identity auto-merge-signed.yml already
      # uses to push signed commits straight to main, and it does bypass the
      # ruleset.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - id: release
        uses: ./.github/actions/cut-release
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release
          body: |
            Bumped: `${{ steps.release.outputs.bumped || 'none' }}`. GPG
            signing: `${{ steps.release.outputs.gpg_available }}`. `multicz
            plan` and `multicz bump` append their own detail above.

  # Build and publish the bumped components: cross-compiled binaries and .deb
  # packages attached to a per-component GitHub Release. Matrix over each
  # bumped component so one failure does not abort the others.
  publish:
    name: publish (${{ matrix.component }})
    needs: [detect, release]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.release.outputs.no_bumps == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.release.outputs.bumped_json) }}
    permissions:
      contents: write
      actions: write # delete the consumed CI artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: publish
        uses: ./.github/actions/publish-component
        with:
          component: ${{ matrix.component }}
      # infra-spa is a standalone SPA tarball, not one of the nine Arch
      # packages - see publish-component's own infra-spa branch.
      - if: matrix.component != 'infra-spa'
        uses: ./.github/actions/push-aur
        with:
          component: ${{ matrix.component }}
          aur-ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: publish (${{ matrix.component }})
          body: |
            Cross-compiled `linux/amd64` + `linux/arm64`, packaged the `.deb`s
            and cut the GitHub Release for `${{ matrix.component }}`. Published
            the validated amd64 `.deb`: `${{ steps.publish.outputs.has_deb }}`.

  # Build the Zensical site and deploy to GitHub Pages. Runs on either signal
  # that can change the published output: a direct edit under docs/ or
  # zensical.toml (`docs_changed`), or a release bump (the site embeds
  # version + changelog content, so every bump invalidates the rendered
  # output even when no markdown changed). Gating on `release.result ==
  # 'success'` alone, as this job used to, missed the first case entirely: a
  # docs-only push has no package changes, so `release` is skipped rather
  # than successful, and the site never rebuilt even though docs/ changed.
  #
  # `needs` repeats the quality-gate list `release` depends on rather than
  # just depending on `release` itself, because a skipped `release` does not
  # say whether those gates passed or never ran - and `docs_changed` must
  # not bypass a real failure among them.
  docs:
    name: docs
    needs:
      - detect
      - license-headers
      - lint
      - www
      - vet-build
      - test
      - gosec
      - govulncheck
      - osv-scanner
      - integration
      - deb-validate
      - archlinux-validate
      - e2e
      - owasp
      - release
    # Unlike `release`, EVERY one of these may legitimately come back
    # `skipped` here - a docs-only push skips every one of them, by design,
    # and that must not block docs. What must still block it is any of them
    # coming back `failure` or `cancelled`, so each is checked for those
    # two explicitly rather than relying on the job-wide `!cancelled() &&
    # !failure()`, whose blind spot is the same one `release` closed above:
    # it cannot distinguish "skipped because not applicable" from "skipped
    # because the run was cancelled before this had a chance to run".
    #
    # always(): none of success()/failure()/cancelled()/always() appears
    # literally above, so without it GitHub silently ANDs an implicit
    # `success()` onto the whole expression - which would require every one
    # of these to have succeeded, breaking every `|| ... == 'skipped'` below
    # and making a docs-only push (where all of them legitimately skip)
    # never actually deploy.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.detect.result == 'success'
      && (
        needs.detect.outputs.docs_changed == 'true'
        || (needs.release.result == 'success' && needs.release.outputs.no_bumps == 'false')
      )
      && (needs.license-headers.result == 'success' || needs.license-headers.result == 'skipped')
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (needs.www.result == 'success' || needs.www.result == 'skipped')
      && (needs.vet-build.result == 'success' || needs.vet-build.result == 'skipped')
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.gosec.result == 'success' || needs.gosec.result == 'skipped')
      && (needs.govulncheck.result == 'success' || needs.govulncheck.result == 'skipped')
      && (needs.osv-scanner.result == 'success' || needs.osv-scanner.result == 'skipped')
      && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
      && (needs.deb-validate.result == 'success' || needs.deb-validate.result == 'skipped')
      && (needs.archlinux-validate.result == 'success' || needs.archlinux-validate.result == 'skipped')
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
      && (needs.owasp.result == 'success' || needs.owasp.result == 'skipped')
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.docs.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: docs
        uses: ./.github/actions/build-docs
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs
          body: |
            `zensical build --clean` deployed to GitHub Pages:
            ${{ steps.docs.outputs.page_url }}
