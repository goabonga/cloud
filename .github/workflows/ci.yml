    # See deb-validate-infra's identical condition for the reasoning.
    if: always() && needs.archlinux-infra-www.result == 'success'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/validate-archlinux
        with:
          component: infra-www
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: archlinux-validate (infra-www)
          body: |
            namcap and `test/install/validate-archlinux.sh` against the
            installed package.
  # ---------------------------------------------------------------------
  # End-to-end and DAST. Both bring the control plane up from source as plain
  # processes against PostgreSQL - the same five binaries `deploy/ansible`
  # installs as .debs, not a cluster nothing in this repo's own install path
  # uses. Each job starts its own stack: a shared one would make a ZAP failure
  # and an e2e failure indistinguishable, and the runners are parallel anyway.
  # ---------------------------------------------------------------------

  e2e:
    name: e2e
    needs: detect
    if: >-
      needs.detect.result == 'success'
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack-up
        with:
          postgres-dsn: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
      - name: Run the end-to-end suite
        run: test/e2e/smoke.sh
      # stack-up dumps on its own failure; this covers a failure of the suite
      # itself, which runs after the stack is up.
      - name: Dump logs on failure
        if: failure()
        run: cat /tmp/stack-logs/*.log || true
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: e2e
          body: |
            infra-api, infra-controller-manager, infra-idp, infra-exporter and
            infra-www built from source and run against PostgreSQL, then
            `test/e2e/smoke.sh` over the API, identity provider, exporter and
            dashboard.

  # ---------------------------------------------------------------------
  # DAST. Named per target for the same visibility reason as deb/archlinux
  # above - previously a 2-leg matrix, small enough that this mostly just
  # drops the matrix boilerplate rather than changing much.
  # ---------------------------------------------------------------------

  owasp-api:
    name: owasp (api)
    needs: [detect, e2e]
    # has_package_changes is repeated from `e2e` on purpose: a docs-only push
    # must not stand up two stacks to scan a control plane nothing changed.
    # Checking `needs.e2e.result` explicitly, rather than the job-wide
    # `!cancelled() && !failure()`, means a real e2e failure or anything
    # other than `success` blocks this - no reliance on how a cancellation
    # happens to be attributed upstream.
    if: >-
      needs.detect.result == 'success'
      && needs.detect.outputs.has_package_changes == 'true'
      && needs.e2e.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack-up
        with:
          postgres-dsn: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
      - uses: ./.github/actions/owasp-scan
        with:
          target: http://127.0.0.1:8080
          name: api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp (api)
          body: |
            ZAP baseline against `api` on port `8080`, gated by
            `.zap/rules.tsv`. Full report in artifact `zap-api`.

  owasp-www:
    name: owasp (www)
    needs: [detect, e2e]
    if: >-
      needs.detect.result == 'success'
      && needs.detect.outputs.has_package_changes == 'true'
      && needs.e2e.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack-up
        with:
          postgres-dsn: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
      - uses: ./.github/actions/owasp-scan
        with:
          target: http://127.0.0.1:8088
          name: www
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp (www)
          body: |
            ZAP baseline against `www` on port `8088`, gated by
            `.zap/rules.tsv`. Full report in artifact `zap-www`.

  # ---------------------------------------------------------------------
  # Release on main only. multicz bumps cmd/<dir>/version.go, writes
  # changelogs, creates the release commit and per-component tags, and pushes
  # back to main. Artifact distribution is handled by the `publish` job.
  release:
    name: release
    needs:
      - detect
      - license-headers
      - lint
      - www
      - vet-build
      - test
      - gosec
      - govulncheck
      - osv-scanner
      - integration
      - deb-validate-infra
      - deb-validate-infra-api
      - deb-validate-infra-idp
      - deb-validate-infra-exporter
      - deb-validate-infra-controller-manager
      - deb-validate-infra-agent
      - deb-validate-infra-container-init
      - deb-validate-terraform-provider-infra
      - deb-validate-infra-www
      - archlinux-validate-infra
      - archlinux-validate-infra-api
      - archlinux-validate-infra-idp
      - archlinux-validate-infra-exporter
      - archlinux-validate-infra-controller-manager
      - archlinux-validate-infra-agent
      - archlinux-validate-infra-container-init
      - archlinux-validate-terraform-provider-infra
      - archlinux-validate-infra-www
      - e2e
      - owasp-api
      - owasp-www
    # Every need below shares has_package_changes' own gate except `www`
    # (gated independently on www_changed, legitimately skipped on a
    # non-frontend push) - so every one of them is required to have actually
    # SUCCEEDED, `www` alone excepted. This used to read
    # `!cancelled() && !failure()`, which tolerates ANY need coming back
    # `skipped` for whatever reason, not just www's legitimate one - the
    # same shape of gap that let test-pipelilne-multicz's release-bump fire
    # once on a run cancelled before its validations had even dispatched,
    # tagging a release with nothing published behind it. Checking each
    # `result` directly closes that regardless of how GitHub happens to
    # attribute a cancellation to the jobs underneath it.
    #
    # always(): none of success()/failure()/cancelled()/always() appears
    # literally above, so without it GitHub silently ANDs an implicit
    # `success()` onto the whole expression - which would require `www` to
    # have succeeded even when www_changed is false and it legitimately
    # skipped, defeating that OR entirely.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.detect.result == 'success'
      && needs.detect.outputs.has_package_changes == 'true'
      && needs.license-headers.result == 'success'
      && needs.lint.result == 'success'
      && (needs.www.result == 'success' || needs.detect.outputs.www_changed != 'true')
      && needs.vet-build.result == 'success'
      && needs.test.result == 'success'
      && needs.gosec.result == 'success'
      && needs.govulncheck.result == 'success'
      && needs.osv-scanner.result == 'success'
      && needs.integration.result == 'success'
      && needs.deb-validate-infra.result == 'success'
      && needs.deb-validate-infra-api.result == 'success'
      && needs.deb-validate-infra-idp.result == 'success'
      && needs.deb-validate-infra-exporter.result == 'success'
      && needs.deb-validate-infra-controller-manager.result == 'success'
      && needs.deb-validate-infra-agent.result == 'success'
      && needs.deb-validate-infra-container-init.result == 'success'
      && needs.deb-validate-terraform-provider-infra.result == 'success'
      && needs.deb-validate-infra-www.result == 'success'
      && needs.archlinux-validate-infra.result == 'success'
      && needs.archlinux-validate-infra-api.result == 'success'
      && needs.archlinux-validate-infra-idp.result == 'success'
      && needs.archlinux-validate-infra-exporter.result == 'success'
      && needs.archlinux-validate-infra-controller-manager.result == 'success'
      && needs.archlinux-validate-infra-agent.result == 'success'
      && needs.archlinux-validate-infra-container-init.result == 'success'
      && needs.archlinux-validate-terraform-provider-infra.result == 'success'
      && needs.archlinux-validate-infra-www.result == 'success'
      && needs.e2e.result == 'success'
      && needs.owasp-api.result == 'success'
      && needs.owasp-www.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      no_bumps: ${{ steps.release.outputs.no_bumps }}
      bumped: ${{ steps.release.outputs.bumped }}
      bumped_json: ${{ steps.release.outputs.bumped_json }}
    steps:
      # `main-protection` (the repo ruleset) requires every change to main to
      # go through a pull request; the default GITHUB_TOKEN authenticates as
      # github-actions[bot], which has no bypass for it. RELEASE_PAT is the
      # maintainer's own PAT, the same identity auto-merge-signed.yml already
      # uses to push signed commits straight to main, and it does bypass the
      # ruleset.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - id: release
        uses: ./.github/actions/cut-release
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release
          body: |
            Bumped: `${{ steps.release.outputs.bumped || 'none' }}`. GPG
            signing: `${{ steps.release.outputs.gpg_available }}`. `multicz
            plan` and `multicz bump` append their own detail above.

  # Build and publish the bumped components: cross-compiled binaries, .deb
  # and Arch packages attached to a per-component GitHub Release, and an AUR
  # push when configured. Named per component (one job per possible release,
  # gated on whether it actually bumped) rather than a matrix over the
  # dynamic bumped_json list, for the same visibility reason as deb/archlinux
  # above - most runs bump zero or one component, so this mostly shows as a
  # short list of skipped jobs plus the one or two that actually ran.
  # ---------------------------------------------------------------------

  publish-infra:
    name: publish (infra)
    needs: [detect, release]
    # contains(): bumped_json lists only the components that actually bumped
    # this run - everything else in this group skips, same as the matrix
    # version's per-component `include` entries never ran for an untouched
    # component.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && contains(fromJson(needs.release.outputs.bumped_json), 'infra')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write # delete the consumed CI artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: publish
        uses: ./.github/actions/publish-component
        with:
          component: infra
      - uses: ./.github/actions/push-aur
        with:
          component: infra
          aur-ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: publish (infra)
          body: |
            Cross-compiled `linux/amd64` + `linux/arm64`, packaged the `.deb`
            and Arch package, and cut the GitHub Release. Published the
            validated amd64 `.deb`: `${{ steps.publish.outputs.has_deb }}`.

