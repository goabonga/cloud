  # Build the Zensical site and deploy to GitHub Pages. Runs on either signal
  # that can change the published output: a direct edit under docs/ or
  # zensical.toml (`docs_changed`), or a release bump (the site embeds
  # version + changelog content, so every bump invalidates the rendered
  # output even when no markdown changed). Gating on `release.result ==
  # 'success'` alone, as this job used to, missed the first case entirely: a
  # docs-only push has no package changes, so `release` is skipped rather
  # than successful, and the site never rebuilt even though docs/ changed.
  #
  # `needs` repeats the quality-gate list `release` depends on rather than
  # just depending on `release` itself, because a skipped `release` does not
  # say whether those gates passed or never ran - and `docs_changed` must
  # not bypass a real failure among them.
  docs:
    name: docs
    needs:
      - detect
      - license-headers
      - lint
      - www
      - vet-build
      - test
      - gosec
      - govulncheck
      - osv-scanner
      - integration
      - deb-validate-infra
      - deb-validate-infra-api
      - deb-validate-infra-idp
      - deb-validate-infra-exporter
      - deb-validate-infra-controller-manager
      - deb-validate-infra-agent
      - deb-validate-infra-container-init
      - deb-validate-terraform-provider-infra
      - deb-validate-infra-www
      - archlinux-validate-infra
      - archlinux-validate-infra-api
      - archlinux-validate-infra-idp
      - archlinux-validate-infra-exporter
      - archlinux-validate-infra-controller-manager
      - archlinux-validate-infra-agent
      - archlinux-validate-infra-container-init
      - archlinux-validate-terraform-provider-infra
      - archlinux-validate-infra-www
      - e2e
      - owasp-api
      - owasp-www
      - release
    # Unlike `release`, EVERY one of these may legitimately come back
    # `skipped` here - a docs-only push skips every one of them, by design,
    # and that must not block docs. What must still block it is any of them
    # coming back `failure` or `cancelled`, so each is checked for those
    # two explicitly rather than relying on the job-wide `!cancelled() &&
    # !failure()`, whose blind spot is the same one `release` closed above:
    # it cannot distinguish "skipped because not applicable" from "skipped
    # because the run was cancelled before this had a chance to run".
    #
    # always(): none of success()/failure()/cancelled()/always() appears
    # literally above, so without it GitHub silently ANDs an implicit
    # `success()` onto the whole expression - which would require every one
    # of these to have succeeded, breaking every `|| ... == 'skipped'` below
    # and making a docs-only push (where all of them legitimately skip)
    # never actually deploy.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.detect.result == 'success'
      && (
        needs.detect.outputs.docs_changed == 'true'
        || (needs.release.result == 'success' && needs.release.outputs.no_bumps == 'false')
      )
      && (needs.license-headers.result == 'success' || needs.license-headers.result == 'skipped')
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (needs.www.result == 'success' || needs.www.result == 'skipped')
      && (needs.vet-build.result == 'success' || needs.vet-build.result == 'skipped')
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.gosec.result == 'success' || needs.gosec.result == 'skipped')
      && (needs.govulncheck.result == 'success' || needs.govulncheck.result == 'skipped')
      && (needs.osv-scanner.result == 'success' || needs.osv-scanner.result == 'skipped')
      && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
      && (needs.deb-validate-infra.result == 'success' || needs.deb-validate-infra.result == 'skipped')
      && (needs.deb-validate-infra-api.result == 'success' || needs.deb-validate-infra-api.result == 'skipped')
      && (needs.deb-validate-infra-idp.result == 'success' || needs.deb-validate-infra-idp.result == 'skipped')
      && (needs.deb-validate-infra-exporter.result == 'success' || needs.deb-validate-infra-exporter.result == 'skipped')
      && (needs.deb-validate-infra-controller-manager.result == 'success' || needs.deb-validate-infra-controller-manager.result == 'skipped')
      && (needs.deb-validate-infra-agent.result == 'success' || needs.deb-validate-infra-agent.result == 'skipped')
      && (needs.deb-validate-infra-container-init.result == 'success' || needs.deb-validate-infra-container-init.result == 'skipped')
      && (needs.deb-validate-terraform-provider-infra.result == 'success' || needs.deb-validate-terraform-provider-infra.result == 'skipped')
      && (needs.deb-validate-infra-www.result == 'success' || needs.deb-validate-infra-www.result == 'skipped')
      && (needs.archlinux-validate-infra.result == 'success' || needs.archlinux-validate-infra.result == 'skipped')
      && (needs.archlinux-validate-infra-api.result == 'success' || needs.archlinux-validate-infra-api.result == 'skipped')
      && (needs.archlinux-validate-infra-idp.result == 'success' || needs.archlinux-validate-infra-idp.result == 'skipped')
      && (needs.archlinux-validate-infra-exporter.result == 'success' || needs.archlinux-validate-infra-exporter.result == 'skipped')
      && (needs.archlinux-validate-infra-controller-manager.result == 'success' || needs.archlinux-validate-infra-controller-manager.result == 'skipped')
      && (needs.archlinux-validate-infra-agent.result == 'success' || needs.archlinux-validate-infra-agent.result == 'skipped')
      && (needs.archlinux-validate-infra-container-init.result == 'success' || needs.archlinux-validate-infra-container-init.result == 'skipped')
      && (needs.archlinux-validate-terraform-provider-infra.result == 'success' || needs.archlinux-validate-terraform-provider-infra.result == 'skipped')
      && (needs.archlinux-validate-infra-www.result == 'success' || needs.archlinux-validate-infra-www.result == 'skipped')
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
      && (needs.owasp-api.result == 'success' || needs.owasp-api.result == 'skipped')
      && (needs.owasp-www.result == 'success' || needs.owasp-www.result == 'skipped')
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.docs.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: docs
        uses: ./.github/actions/build-docs
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs
          body: |
            `zensical build --clean` deployed to GitHub Pages:
            ${{ steps.docs.outputs.page_url }}
