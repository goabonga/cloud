          body: amd64 package uploaded as `infra-idp-deb`.

  deb-infra-exporter:
    name: deb (infra-exporter)
    needs: [detect, lint, vet-build, test, gosec, govulncheck, osv-scanner]
    # See deb-infra's identical condition for the reasoning.
    if: >-
      always() && (
