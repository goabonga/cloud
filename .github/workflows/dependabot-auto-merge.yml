name: dependabot-auto-merge

# Applies the `auto-merge` label to a Dependabot PR once its `ci` run has
# gone green, so the PR flows into auto-merge-signed.yml without a maintainer
# labelling it by hand.
#
# Triggered by `workflow_run` on ci.yml rather than `pull_request_target`: the
# same fork-safety argument as dependabot-rewrite.yml applies - a fork can
# only ever complete a `pull_request`-triggered run, and this listens for that
# completion in the base-repo context instead of running PR content directly.
#
# The run that actually matters here is the one AFTER dependabot-rewrite.yml's
# force-push (the rewritten, signed commits), not Dependabot's own original
# push - and that push is authenticated as RELEASE_PAT's owner, not
# dependabot[bot], so `workflow_run.actor` cannot identify a Dependabot PR
# here. The step below checks the PR's actual author via the API instead,
# which a force-push never changes.
#
# The label must be applied by a token that is a repository collaborator:
# auto-merge-signed.yml's own gate re-verifies the labeller's write access via
# `collaborators/{login}/permission`, and github-actions[bot] is not a
# collaborator. RELEASE_PAT (the maintainer's classic PAT) is used instead, so
# the resulting `labeled` event's sender passes that check.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

jobs:
  label:
    name: label green Dependabot PRs for auto-merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Add the auto-merge label
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_PAT is not configured; cannot label as a collaborator identity, skipping"
            exit 0
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::workflow_run carried no pull request"
            exit 1
          fi
          author=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')
          if [ "$author" != "dependabot[bot]" ]; then
            echo "PR #$PR_NUMBER was opened by $author, not dependabot[bot]; not labelling"
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --add-label auto-merge
