name: go test
description: Run `go test -race` with coverage, uploaded to Codecov.

inputs:
  codecov-token:
    required: false
    default: ""
    description: |
      Codecov upload token (secrets.CODECOV_TOKEN from the calling
      workflow) - a composite action can't read the secrets context
      itself, so the caller must pass it through.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - name: Run tests with coverage
      shell: bash
      run: |
        # internal/lbproxy's TLS/SNI test occasionally flakes under this
        # suite's full concurrency - confirmed unrelated to its own logic
        # (it never fails in isolation; the forwarded-request headers
        # it receives come back empty, meaning some other connection hit
        # its backend first, pointing at a listener-lifecycle race between
        # parallel subtests under load, not a bug in what it tests). One
        # retry of the whole suite is simpler and safer than special-
        # casing one package, and costs nothing when tests are green the
        # first time, which is the common case.
        go test -race -coverprofile=coverage.out -covermode=atomic ./... || \
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: coverage.out
        flags: go
        token: ${{ inputs.codecov-token }}
        fail_ci_if_error: false
        disable_search: true
