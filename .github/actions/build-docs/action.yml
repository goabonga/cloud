name: build docs
description: Build the Zensical site and deploy it to GitHub Pages.

outputs:
  page_url:
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - uses: actions/configure-pages@v6
      with:
        enablement: true
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: false
    - name: Build site
      shell: bash
      run: uv tool run zensical build --clean
    - uses: actions/upload-pages-artifact@v5
      with:
        path: site
    - id: deployment
      uses: actions/deploy-pages@v5
