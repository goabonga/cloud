[project]
site_name = "infrastructure"
site_description = "Declarative, Linux-native cloud control plane: CLI, API, agent, Terraform provider."
site_author = "Chris"
site_url = "https://goabonga.github.io/infrastructure/"
repo_url = "https://github.com/goabonga/infrastructure"
repo_name = "goabonga/infrastructure"

# Navigation tree for the published site. Order follows the reader's path:
# concepts -> getting hands-on -> architecture -> operating it -> provider
# reference -> policy. Provider resource pages are generated by `make docs-gen`.
nav = [
    { "Introduction" = "index.md" },
    { "Guide" = [
        { "Getting started" = "guide/getting-started.md" },
        { "Installation" = "guide/installation.md" },
    ] },
    { "Architecture" = [
        { "Overview" = "architecture/overview.md" },
        { "Resource model" = "architecture/resource-model.md" },
        { "Realization" = "architecture/realization.md" },
        { "Load balancer data plane" = "architecture/load-balancer-data-plane.md" },
        { "Scheduling" = "architecture/scheduling.md" },
        { "FaaS functions" = "architecture/faas.md" },
    ] },
    { "Operations" = [
        { "Deployment" = "operations/deploy.md" },
        { "Secrets and PKI" = "operations/secrets.md" },
    ] },
    { "Terraform provider" = [
        { "Overview" = "provider/index.md" },
        { "infra_vpc" = "provider/resources/vpc.md" },
        { "infra_function" = "provider/resources/function.md" },
    ] },
    { "Stability & deprecation" = "stability.md" },
]

# Footer. `copyright` renders in the highlighted slot of
# `partials/copyright.html`, above the theme's own attribution line;
# `extra.generator = false` is the switch that partial reads to drop
# that line, leaving this as the only footer text. Raw HTML, not
# Markdown - the value is interpolated into the template as-is.
copyright = """
Made with <span style="color: #e25555;">&#10084;</span> by
<a href="https://github.com/goabonga" target="_blank" rel="noopener">goabonga</a>
"""

[project.extra]
generator = false

# Branding. Both files are generated from `assets/infrastructure.svg` by
# `scripts/regen-icons.sh` and committed: the docs job builds the site
# from the checked-in tree and never installs cairosvg/Pillow. Paths
# resolve relative to the docs dir.
[project.theme]
logo = "infrastructure.svg"
favicon = "favicon.ico"

# Dark first. Neither entry declares `media`, so the OS
# `prefers-color-scheme` is ignored and every visitor lands on the first
# one - slate - whatever their system is set to. The toggle in the
# header switches to the next entry and the theme persists that choice
# in localStorage, so the pin only decides the *first* visit.
#
# Blue matches the logo's hub-and-spoke mark. Without an explicit
# `primary`/`accent` the palette partial falls back to indigo, which
# clashes with it.
[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "light blue"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "light blue"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }
