# One chart for the whole control plane rather than one chart per component.
# The five workloads below are not independently useful - a controller-manager
# with no API server reconciles nothing - so they version, deploy and roll
# together. Per-component image tags are still mirrored in individually by
# multicz, so a single component's release cascades a chart patch.

nameOverride: ""
fullnameOverride: ""

image:
  # Images are published to ghcr.io by the release pipeline.
  registry: ghcr.io/goabonga
  # Always, not IfNotPresent. The release also pushes a mutable `latest` tag,
  # and a node that already cached an image under a tag that has since moved
  # would otherwise keep running the stale one indefinitely.
  pullPolicy: Always
  pullSecrets: []

# State backend shared by api, controller-manager and exporter.
#
# The file-backed store cannot be shared between pods, so any component with
# more than one replica requires the PostgreSQL DSN. The chart refuses to
# render otherwise rather than deploying a control plane whose replicas
# silently disagree about cluster state.
state:
  # Inline DSN. Use existingSecret in anything but a throwaway install: a DSN
  # here lands in the release manifest and in `helm get values` output.
  dsn: ""
  existingSecret: ""
  existingSecretKey: dsn
  # Mount point for the file-backed store when no DSN is configured. Backed by
  # an emptyDir, so it is ephemeral by construction - single-replica
  # development only.
  path: /var/lib/infra

serviceAccount:
  create: true
  name: ""
  annotations: {}

# The workloads. `port` empty means the component listens on nothing.
components:
  api:
    enabled: true
    image:
      repository: infra-api
      tag: 0.13.0
    # One replica by default so the chart installs with no configuration. The
    # file-backed store is per-pod, so raising this requires state.dsn or
    # state.existingSecret - the chart refuses to render otherwise rather than
    # deploying replicas that disagree about cluster state.
    replicas: 1
    port: 8080
    needsState: true
    service:
      enabled: true
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    env: []

  controller-manager:
    enabled: true
    image:
      repository: infra-controller-manager
      tag: 0.9.0
    # Leader election means extra replicas are standby, not throughput, so two
    # buys failover and nothing else. Left at one for the same reason as the
    # API server: a default install should not require a database.
    replicas: 1
    port:
    needsState: true
    service:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    env: []

  idp:
    # Off by default. It is the one component that cannot be deployed without
    # a credential - see clients below - so a chart that enabled it would
    # either fail to install out of the box or ship a default bearer token.
    # The API can verify tokens from any issuer via GOA_API_JWT_PUBKEY, so
    # this is genuinely optional.
    enabled: false
    image:
      repository: infra-idp
      tag: 0.1.1
    # infra-idp exits at startup unless at least one client is configured - it
    # has nothing to issue tokens to otherwise. The chart requires one rather
    # than deploying a pod that crash-loops, and refuses to render without it.
    #
    # Format: "token:subject,token2:subject2". Use existingSecret in anything
    # but a throwaway install: these are bearer credentials, and `clients` here
    # lands in the release manifest and in `helm get values` output.
    clients: ""
    existingSecret: ""
    existingSecretKey: clients
    replicas: 2
    port: 8081
    needsState: false
    service:
      enabled: true
      type: ClusterIP
      port: 8081
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    env: []

  exporter:
    enabled: true
    image:
      repository: infra-exporter
      tag: 0.1.1
    # Every replica scrapes the same state and reports the same numbers, so a
    # second one only duplicates the series.
    replicas: 1
    port: 9100
    needsState: true
    service:
      enabled: true
      type: ClusterIP
      port: 9100
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    env: []

  www:
    enabled: true
    image:
      repository: infra-www
      tag: 0.5.2
    # The dashboard proxies /api to the control plane so the browser talks to
    # one origin. Left empty, the chart points it at the in-cluster api Service,
    # which is what makes the two work together out of the box - the binary's
    # own default is http://localhost:8080, which inside a pod is nothing.
    #
    # Set this to reach an API outside the release (a shared control plane, an
    # ingress hostname); then components.api can be disabled.
    apiURL: ""
    replicas: 2
    port: 8088
    needsState: false
    service:
      enabled: true
      type: ClusterIP
      port: 8088
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    env: []

# Applied to every pod. The images run as distroless nonroot (uid 65532) and
# need no capabilities, no privilege escalation and no writable root - so the
# chart asserts all of it rather than trusting the image to have got it right.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Default-deny ingress, per component, with only that component's own port
# opened. A control plane is exactly the workload where a compromised pod
# reaching sideways matters, and the components only ever talk to each other
# through their published ports.
networkPolicy:
  enabled: true
  # Namespaces allowed to reach the components. Empty means the release's own
  # namespace only. The dashboard and the API usually need to be reachable
  # from an ingress controller's namespace as well.
  allowedNamespaces: []
  # Egress is left open: the components resolve DNS and reach PostgreSQL, and
  # pinning those to CIDRs here would encode the cluster's addressing into the
  # chart. Restrict it per install if the environment warrants it.
  restrictEgress: false

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
