[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"
post_bump_policy = "allow"
overlap_policy = "all"

[plugins.go-deps.packages]
cloud = "./cmd/cli"
cloud-api = "./cmd/api"
cloud-ssr = "./cmd/ssr"
cloud-identity-platform = "./cmd/idp"
cloud-fleet = "./cmd/mgr"

[components.cloud-docs]
depends_on = ["cloud", "cloud-api", "cloud-ssr", "cloud-identity-platform", "cloud-www", "cloud-scripts", "cloud-fleet"]
paths = ["docs/**", "zensical.toml", "assets/cloud.svg"]
bump_files = [
    { file = "zensical.toml", key = "project.extra.versions.cloud_docs" },
]
changelog = "docs/CHANGELOG.md"

[components.cloud-docs.bump_rules]
docs = "patch"
ci = "patch"
chore = "patch"
refactor = "patch"
style = "patch"
test = "patch"
build = "patch"
revert = "patch"

[components.cloud-scripts]
paths = ["scripts/**", "pytest.ini"]
bump_files = [{ file = "scripts/pyproject.toml", key = "project.version" }, { file = "zensical.toml", key = "project.extra.versions.cloud_scripts" }]
changelog = "scripts/CHANGELOG.md"
post_bump = ["uv lock --project scripts"]

[components.cloud-scripts.bump_rules]
docs = "patch"
ci = "patch"
chore = "patch"
refactor = "patch"
style = "patch"
test = "patch"
build = "patch"
revert = "patch"

[components.cloud]
paths = ["cmd/cli/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/cli/version.go", key = 'regex:Version\s*=\s*"([^"]+)"' },
    { file = "zensical.toml", key = "project.extra.versions.cloud" },
]
changelog = "cmd/cli/CHANGELOG.md"

[components.cloud.bump_rules]
ci = "patch"
chore = "patch"
refactor = "patch"
test = "patch"
build = "patch"
revert = "patch"

[components.cloud-api]
paths = ["cmd/api/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/api/version.go", key = 'regex:Version\s*=\s*"([^"]+)"' },
    { file = "zensical.toml", key = "project.extra.versions.cloud_api" },
]
changelog = "cmd/api/CHANGELOG.md"

[components.cloud-api.bump_rules]
ci = "patch"
chore = "patch"
refactor = "patch"
test = "patch"
build = "patch"
revert = "patch"

[components.cloud-ssr]
paths = ["cmd/ssr/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/ssr/version.go", key = 'regex:Version\s*=\s*"([^"]+)"' },
    { file = "zensical.toml", key = "project.extra.versions.cloud_ssr" },
]
changelog = "cmd/ssr/CHANGELOG.md"
depends_on = ["cloud-www"]

[components.cloud-ssr.bump_rules]
ci = "patch"
chore = "patch"
refactor = "patch"
test = "patch"
build = "patch"
revert = "patch"

[components.cloud-identity-platform]
paths = ["cmd/idp/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/idp/version.go", key = 'regex:Version\s*=\s*"([^"]+)"' },
    { file = "zensical.toml", key = "project.extra.versions.cloud_identity_platform" },
]
changelog = "cmd/idp/CHANGELOG.md"

[components.cloud-identity-platform.bump_rules]
ci = "patch"
chore = "patch"
refactor = "patch"
test = "patch"
build = "patch"
revert = "patch"

[components.cloud-www]
paths = ["www/**", "assets/cloud.svg"]
bump_files = [
    { file = "www/package.json", key = "version" },
    { file = "zensical.toml", key = "project.extra.versions.cloud_www" },
]
changelog = "www/CHANGELOG.md"
post_bump = ["npm --prefix www install --package-lock-only --ignore-scripts"]

[components.cloud-www.bump_rules]
ci = "patch"
chore = "patch"
refactor = "patch"
test = "patch"
build = "patch"
revert = "patch"

[components.cloud-fleet]
paths = ["cmd/mgr/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/mgr/version.go", key = 'regex:Version\s*=\s*"([^"]+)"' },
    { file = "zensical.toml", key = "project.extra.versions.cloud_fleet" },
]
changelog = "cmd/mgr/CHANGELOG.md"

[components.cloud-fleet.bump_rules]
ci = "patch"
chore = "patch"
refactor = "patch"
test = "patch"
build = "patch"
revert = "patch"
