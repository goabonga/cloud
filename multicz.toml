# multicz.toml - per-component versioning, changelogs and tags for the
# infrastructure monorepo. Driven by Conventional Commits.
# Docs: https://goabonga.github.io/multicz/
#
# This is a single Go module with several published binaries. Each binary is
# a multicz component: its version lives in `cmd/<dir>/version.go` as
# `const Version = "x.y.z"` and is patched on release. Shared packages under
# internal/ (domain, state, meta) are the de-facto core; a change confined to
# them maps to no component and ships no release (see PLAN.md, open decision 2).

[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"
# Regenerate go.sum / prune the module graph after a version bump so the
# committed module metadata stays consistent.
post_bump_policy = "allow"
state_file = ".multicz/state.json"
# packaging/docker/Dockerfile is claimed by infra-api, infra-idp,
# infra-exporter and infra-controller-manager: it is the one Dockerfile all
# four build from. "all" is the intended reading of that overlap - a base-image
# bump changes every image built from it, so every one of them ships a release.
# The default would reject the config outright; "first-match" would release
# whichever component happens to be declared first and silently leave the other
# three on a stale base.
#
# go.mod and go.sum are claimed by every Go component on the same reading:
# a dependency or toolchain bump changes the binaries linked against it, so a
# fix touching only them has to release each one. Whether a given bump ships
# at all is still decided by its commit type: chore(deps) releases nothing,
# and scripts/rewrite-dependabot-commit.sh types a Dependabot bump fix(deps)
# only when it changes what the binaries link.
#
# CAUTION: this fans out the BUMP PLAN only. `multicz changed` does not honour
# it - it attributes a shared file to a single component, and has been observed
# to name components with no changed file at all. So never gate a per-component
# build on `multicz changed` output while an overlap exists; CI builds every
# container and every package on any change for exactly this reason (see the
# `container` job in .github/workflows/ci.yml).
overlap_policy = "all"

# Custom commit types layered on the conventional defaults. `deprecate:`
# announces an upcoming removal; `remove:` performs it after the n+2 window
# (see docs/stability.md). Both bump minor.
[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"
deprecate = "minor"
remove = "minor"

# CHANGELOG layout aligned on Keep-a-Changelog. Sections render in order.
[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Deprecated"
types = ["deprecate"]

[[project.changelog_sections]]
title = "Removed"
types = ["remove"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

# ── Control plane ─────────────────────────────────────────────────────────

[components.infra-api]
paths = ["cmd/api/**", "internal/handler/**", "internal/httpsrv/**", "internal/httpsec/**", "web/**", "packaging/docker/Dockerfile", "go.mod", "go.sum", "deploy/systemd/infra-api.service"]
bump_files = [
    { file = "cmd/api/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/api/CHANGELOG.md"
mirrors = [
    { file = "charts/infra/Chart.yaml", key = "appVersion" },
    { file = "charts/infra/values.yaml", key = "components.api.image.tag" },
]
post_bump = ["go mod tidy"]

[components.infra-controller-manager]
paths = ["cmd/controller-manager/**", "internal/controllers/**", "internal/scheduler/**", "packaging/docker/Dockerfile", "go.mod", "go.sum", "deploy/systemd/infra-controller-manager.service"]
bump_files = [
    { file = "cmd/controller-manager/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/controller-manager/CHANGELOG.md"
mirrors = [
    { file = "charts/infra/values.yaml", key = "components.controller-manager.image.tag" },
]
post_bump = ["go mod tidy"]

# ── Data plane ────────────────────────────────────────────────────────────

[components.infra-agent]
paths = ["cmd/agent/**", "internal/manager/**", "go.mod", "go.sum", "deploy/systemd/infra-agent.service"]
bump_files = [
    { file = "cmd/agent/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/agent/CHANGELOG.md"
post_bump = ["go mod tidy"]

# ── Clients ───────────────────────────────────────────────────────────────

[components.infra]
paths = ["cmd/cli/**", "internal/client/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/cli/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/cli/CHANGELOG.md"
post_bump = ["go mod tidy"]

[components.terraform-provider-infra]
paths = ["cmd/provider/**", "internal/provider/**", "internal/resources/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/provider/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/provider/CHANGELOG.md"
# The provider speaks to the API over HTTP and is version-coupled to it.
depends_on = ["infra-api"]
post_bump = ["go mod tidy"]

# ── Identity ──────────────────────────────────────────────────────────────

[components.infra-idp]
# internal/auth is shared core (consumed by the API too), so it is intentionally
# not owned here; it is added back when the IDP itself is built.
paths = ["cmd/idp/**", "internal/idp/**", "packaging/docker/Dockerfile", "go.mod", "go.sum", "deploy/systemd/infra-idp.service"]
bump_files = [
    { file = "cmd/idp/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/idp/CHANGELOG.md"
mirrors = [
    { file = "charts/infra/values.yaml", key = "components.idp.image.tag" },
]
post_bump = ["go mod tidy"]

# ── Observability ─────────────────────────────────────────────────────────

[components.infra-exporter]
paths = ["cmd/exporter/**", "internal/metrics/**", "packaging/docker/Dockerfile", "go.mod", "go.sum", "deploy/systemd/infra-exporter.service"]
bump_files = [
    { file = "cmd/exporter/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/exporter/CHANGELOG.md"
mirrors = [
    { file = "charts/infra/values.yaml", key = "components.exporter.image.tag" },
]
post_bump = ["go mod tidy"]

# ── Helpers ───────────────────────────────────────────────────────────────

[components.infra-container-init]
paths = ["cmd/container-init/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/container-init/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/container-init/CHANGELOG.md"
post_bump = ["go mod tidy"]

# ── Web ───────────────────────────────────────────────────────────────────

# The Vite SPA (www/) is versioned on its own: it ships as a standalone bundle
# and is embedded into the infra-www binary via go:embed.
[components.infra-spa]
paths = ["www/**"]
bump_files = [
    { file = "www/package.json", key = "regex:\"version\"\\s*:\\s*\"([^\"]+)\"" },
]
changelog = "www/CHANGELOG.md"

# The web dashboard server embeds the SPA, so it depends on infra-spa: a SPA
# change bumps infra-spa and cascades a bump here, rebuilding the embedded binary.
[components.infra-www]
paths = ["cmd/www/**", "internal/web/**", "internal/httpsec/**", "packaging/docker/www.Dockerfile", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/www/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/www/CHANGELOG.md"
mirrors = [
    { file = "charts/infra/values.yaml", key = "components.www.image.tag" },
]
depends_on = ["infra-spa"]
post_bump = ["go mod tidy"]

# ── Deployment ────────────────────────────────────────────────────────────

# The Helm chart is one component, not one per workload: the five containerised
# daemons are not independently useful, so they deploy and roll together. Each
# of them mirrors its image tag into values.yaml above, and every one of those
# writes cascades a patch here - a new image is a new chart, even when no
# template changed.
[components.infra-chart]
paths = ["charts/infra/**"]
bump_files = [
    { file = "charts/infra/Chart.yaml", key = "version" },
]
changelog = "charts/infra/CHANGELOG.md"
