# ── Web ───────────────────────────────────────────────────────────────────

# The Vite SPA (www/) is versioned on its own: it ships as a standalone bundle
# and is embedded into the infra-www binary via go:embed.
[components.infra-spa]
paths = ["www/**"]
bump_files = [
    { file = "www/package.json", key = "regex:\"version\"\\s*:\\s*\"([^\"]+)\"" },
    { file = "zensical.toml", key = "project.extra.versions.infra_spa" },
]
changelog = "www/CHANGELOG.md"

# The web dashboard server embeds the SPA, so it depends on infra-spa: a SPA
# change bumps infra-spa and cascades a bump here, rebuilding the embedded binary.
[components.infra-www]
paths = ["cmd/www/**", "internal/web/**", "internal/httpsec/**", "deploy/systemd/infra-www.service", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/www/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
    { file = "zensical.toml", key = "project.extra.versions.infra_www" },
]
changelog = "cmd/www/CHANGELOG.md"
depends_on = ["infra-spa"]
post_bump = ["go mod tidy"]

[[components.infra-www.writers]]
type            = "debian-changelog"
file            = "cmd/www/debian/changelog"
distribution    = "unstable"
maintainer      = "Chris <goabonga@pm.me>"

[[components.infra-www.artifacts]]
type = "debian"
ref  = "infra-www_{version}_amd64.deb"

[[components.infra-www.artifacts]]
type = "debian"
ref  = "infra-www_{version}_arm64.deb"

[[components.infra-www.artifacts]]
type = "archlinux"
ref  = "infra-www-{version}-1-x86_64.pkg.tar.zst"
