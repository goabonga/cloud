# Static inventory matching the IPs assigned by cloud-init in group_vars/all.yml.
# create-vms.yml provisions these hosts on the libvirt default network.

[control]
infra-control ansible_host=192.168.122.10

[agents]
infra-agent-1 ansible_host=192.168.122.21
infra-agent-2 ansible_host=192.168.122.22

[infra:children]
control
agents

# The agents double as the edges facing the simulated provider.
[edges:children]
agents

# The provider's router, outside the infra cluster.
[upstream]
upstream-sim ansible_host=192.168.122.30
