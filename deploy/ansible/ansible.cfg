[defaults]
inventory = inventory.ini
host_key_checking = False
remote_user = ubuntu
# Every lab VM runs Ubuntu 24.04. Naming its interpreter keeps Ansible from
# discovering one per host and warning that a later install could change it.
interpreter_python = /usr/bin/python3
result_format = yaml

[privilege_escalation]
become = True
