---
- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart upstream-sim
  ansible.builtin.systemd_service:
    name: upstream-sim
    state: restarted
    daemon_reload: true

- name: Reload BIRD
  ansible.builtin.systemd_service:
    name: bird
    state: reloaded
