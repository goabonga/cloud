---
- name: Generate the host management private key
  ansible.builtin.command:
    argv: [openssl, genpkey, -algorithm, EC, -pkeyopt, ec_paramgen_curve:P-256, -out, "{{ management_pki_dir }}/{{ management_host }}.key"]
    creates: "{{ management_pki_dir }}/{{ management_host }}.key"

- name: Configure host identity and server address constraints
  ansible.builtin.copy:
    content: |
      basicConstraints=critical,CA:FALSE
      keyUsage=critical,digitalSignature
      extendedKeyUsage=serverAuth,clientAuth
      subjectAltName=DNS:{{ management_host }},{% if hostvars[management_host].ansible_host is match('^[0-9.]+$') or ':' in hostvars[management_host].ansible_host %}IP{% else %}DNS{% endif %}:{{ hostvars[management_host].ansible_host }}
    dest: "{{ management_pki_dir }}/{{ management_host }}.ext"
    mode: "0600"

- name: Create the host management certificate request
  ansible.builtin.command:
    argv: [openssl, req, -new, -sha256, -key, "{{ management_pki_dir }}/{{ management_host }}.key", -out, "{{ management_pki_dir }}/{{ management_host }}.csr", -subj, "/CN={{ management_host }}"]
    creates: "{{ management_pki_dir }}/{{ management_host }}.csr"

- name: Issue the host management certificate
  ansible.builtin.command:
    argv: [openssl, x509, -req, -sha256, -days, "397", -in, "{{ management_pki_dir }}/{{ management_host }}.csr", -CA, "{{ management_pki_dir }}/ca.crt", -CAkey, "{{ management_pki_dir }}/ca.key", -CAcreateserial, -extfile, "{{ management_pki_dir }}/{{ management_host }}.ext", -out, "{{ management_pki_dir }}/{{ management_host }}.crt"]
    creates: "{{ management_pki_dir }}/{{ management_host }}.crt"

- name: Protect the host management private key
  ansible.builtin.file:
    path: "{{ management_pki_dir }}/{{ management_host }}.key"
    mode: "0600"
