---
# Generated once on the controller and reused across runs. The IdP signs JWTs
# with the private key; the API verifies them with the derived public key. The
# KMS key encrypts secrets and disks; agents and the API must share it.
- name: Ensure the local credentials directory exists
  ansible.builtin.file:
    path: "{{ cred_dir }}"
    state: directory
    mode: "0700"

- name: Generate the KMS key (base64-encoded 32 bytes)
  ansible.builtin.command: "openssl rand -base64 -out {{ kms_key_file }} 32"
  args:
    creates: "{{ kms_key_file }}"

- name: Generate the IdP ES256 private key
  ansible.builtin.command: "openssl ecparam -name prime256v1 -genkey -noout -out {{ idp_key_file }}"
  args:
    creates: "{{ idp_key_file }}"

- name: Derive the JWT verification public key
  ansible.builtin.command: "openssl ec -in {{ idp_key_file }} -pubout -out {{ jwt_pub_file }}"
  args:
    creates: "{{ jwt_pub_file }}"

- name: Generate the Terraform IdP client secret
  ansible.builtin.command: "openssl rand -hex -out {{ idp_client_secret_file }} 24"
  args:
    creates: "{{ idp_client_secret_file }}"

- name: Lock down the private credential files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
  loop:
    - "{{ kms_key_file }}"
    - "{{ idp_key_file }}"
    - "{{ idp_client_secret_file }}"
