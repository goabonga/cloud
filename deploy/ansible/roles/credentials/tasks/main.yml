---
# Generated once on the controller and reused across runs. The IdP signs JWTs
# with the private key; the API verifies them with the derived public key. The
# KMS key encrypts secrets and disks; agents and the API must share it.
- name: Ensure the local credentials directory exists
  ansible.builtin.file:
    path: "{{ cred_dir }}"
    state: directory
    mode: "0700"

- name: Generate the KMS key (base64-encoded 32 bytes)
  ansible.builtin.command: "openssl rand -base64 -out {{ kms_key_file }} 32"
  args:
    creates: "{{ kms_key_file }}"

- name: Generate the IdP ES256 private key
  ansible.builtin.command: "openssl ecparam -name prime256v1 -genkey -noout -out {{ idp_key_file }}"
  args:
    creates: "{{ idp_key_file }}"

- name: Derive the JWT verification public key
  ansible.builtin.command: "openssl ec -in {{ idp_key_file }} -pubout -out {{ jwt_pub_file }}"
  args:
    creates: "{{ jwt_pub_file }}"

- name: Generate the Terraform IdP client secret
  ansible.builtin.command: "openssl rand -hex -out {{ idp_client_secret_file }} 24"
  args:
    creates: "{{ idp_client_secret_file }}"

- name: Generate the IdP admin bootstrap password
  ansible.builtin.command: "openssl rand -base64 -out {{ idp_admin_password_file }} 18"
  args:
    creates: "{{ idp_admin_password_file }}"

- name: Lock down the private credential files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
  loop:
    - "{{ kms_key_file }}"
    - "{{ idp_key_file }}"
    - "{{ idp_client_secret_file }}"
    - "{{ idp_admin_password_file }}"

- name: Create the local management PKI directory
  ansible.builtin.file:
    path: "{{ management_pki_dir }}"
    state: directory
    mode: "0700"

- name: Generate the dedicated management CA key
  ansible.builtin.command:
    argv: [openssl, genpkey, -algorithm, EC, -pkeyopt, ec_paramgen_curve:P-256, -out, "{{ management_pki_dir }}/ca.key"]
    creates: "{{ management_pki_dir }}/ca.key"

- name: Generate the dedicated management root certificate
  ansible.builtin.command:
    argv: [openssl, req, -new, -x509, -sha256, -days, "3650", -key, "{{ management_pki_dir }}/ca.key", -out, "{{ management_pki_dir }}/ca.crt", -subj, /CN=infra-management, -addext, "basicConstraints=critical,CA:TRUE", -addext, "keyUsage=critical,keyCertSign,cRLSign"]
    creates: "{{ management_pki_dir }}/ca.crt"

- name: Issue a dedicated identity for every infrastructure host
  ansible.builtin.include_tasks: node_tls.yml
  loop: "{{ groups['infra'] }}"
  loop_control:
    loop_var: management_host

- name: Protect the management CA signing key
  ansible.builtin.file:
    path: "{{ management_pki_dir }}/ca.key"
    mode: "0600"
