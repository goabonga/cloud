---
- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Restart grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
    daemon_reload: true
