# Full-stack deployment onto the provisioned VMs:
#   - etcd as the shared state backend, one member on every host,
#   - the control plane: infra-api and infra-exporter on the control host,
#     infra-controller-manager on both agent hosts under leader election,
#   - infra-idp issuing ES256 JWTs, verified by the API,
#   - the infra-www dashboard (embedded SPA + API reverse proxy),
#   - a native Prometheus + Grafana stack,
#   - infra-agent on every agent host, all sharing the etcd store.
#
# Build the artifacts first (from the repository root):
#   make deb VERSION=<version>   # the .deb packages, into dist/
#   make build-www              # the dashboard binary, into build/
# Keep `version` in group_vars/all.yml in sync with VERSION.
#
# Then, as your normal user (not under sudo):
#   ansible-playbook --ask-become-pass site.yml
---
- name: Generate local credentials
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - credentials

# Every member has to be started in the same run for the cluster to form, so
# etcd gets a play of its own across the whole inventory.
- name: Shared state
  hosts: infra
  become: true
  roles:
    - common
    - etcd

- name: Control plane, identity, dashboard and monitoring
  hosts: control
  become: true
  roles:
    - control_plane
    - idp
    - dashboard
    - monitoring
  post_tasks:
    - name: Wait for the API to report healthy
      ansible.builtin.uri:
        url: "http://{{ control_ip }}:{{ api_addr | regex_replace('^:', '') }}/healthz"
        status_code: 200
      register: api_health
      retries: 10
      delay: 3
      until: api_health.status == 200

- name: Agents
  hosts: agents
  become: true
  roles:
    - agent
    - controller_manager
