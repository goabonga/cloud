  infrastructure master logo. Regenerate the derived assets
  (docs/infrastructure.svg, docs/favicon.ico) with `scripts/regen-icons.sh`
  after editing.

  A hub-and-spoke control plane: one node reconciling four, the same shape
  the agent/controller-manager split draws on every host. The palette is
  cool blue on near-black, read as "network" rather than any one component.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Rounded shell, then the screen it frames -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="#1565C0"/>
  <rect x="34" y="34" width="188" height="188" rx="40" fill="#081018"/>
  <!-- Spokes: control plane reconciling out to each agent -->
  <g stroke="#4FC3F7" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="73"/>
    <line x1="128" y1="128" x2="183" y2="128"/>
    <line x1="128" y1="128" x2="128" y2="183"/>
    <line x1="128" y1="128" x2="73" y2="128"/>
  </g>
  <!-- Agent nodes at the four cardinal hosts -->
  <g fill="#1565C0" stroke="#4FC3F7" stroke-width="6">
    <circle cx="128" cy="66" r="15"/>
    <circle cx="190" cy="128" r="15"/>
    <circle cx="128" cy="190" r="15"/>
    <circle cx="66" cy="128" r="15"/>
  </g>
  <!-- Control plane hub -->
  <circle cx="128" cy="128" r="23" fill="#4FC3F7"/>
</svg>
